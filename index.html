    case 'delTeam':{const pro=!!d.pro;return sheetWrap('Remove '+esc(d.name)+'?',`<p style="margin:0 0 10px;line-height:1.45">This removes <b>${esc(d.name)}</b> for everyone who has access, along with its squad, matches, stats and attendance. It cannot be undone from the app.</p>${pro?'':`<label>Type the team name to confirm<input data-sbind="typed" value="${esc(d.typed||'')}" placeholder="${esc(d.name)}" autocomplete="off" autocapitalize="off"></label>`}${d.err?`<div class="err">${esc(d.err)}</div>`:''}<button class="btn block lg" id="delteambtn" data-act="delTeamGo" style="background:var(--bad);color:#fff" ${(!pro&&String(d.typed||'').trim().toLowerCase()!==String(d.name).trim().toLowerCase())||d.busy?'disabled':''}>${d.busy?'Removing…':pro?'Yes, remove this team':'Remove team'}</button><div style="text-align:center;margin-top:8px"><button class="linkbtn" data-act="closeSheet">Keep it</button></div>`)}
    case 'proPick':return sheetWrap('Add team',`<label>Club<input data-sbind="q" id="proq" value="${esc(d.q||'')}" placeholder="Start typing, e.g. Celtic" autocomplete="off"></label><div id="proclist">${proPickList(d.q||'')}</div>${d.err?`<div class="err">${esc(d.err)}</div>`:''}<div class="note">Picks the club and fills in the team name, colours, ground and age group "Professional". Their fixtures and results then come in automatically.</div>`);
    case 'allteams':return sheetWrap('All teams',(d.list?(d.list.length?d.list.map(t=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-weight:700;overflow-wrap:anywhere;margin-bottom:6px">${esc(t.name)}</div><div style="display:flex;gap:8px"><button class="btn sec" data-act="atView" data-id="${esc(t.id)}" style="flex:1;min-height:42px;font-size:15px;margin:0">View</button></div></div>`).join(''):'<div class="empty">No teams yet.</div>'):'<div class="note">Loading…</div>')+(d.err?`<div class="err">${esc(d.err)}</div>`:'')+'<div class="note">View: look at everything, read only. Coach: adds you as a coach so you can record and edit.</div>');
  }
  return '';
}

/* ---------- extra actions ---------- */
const EDIT_ACTS=new Set(['delTeamOpen','proFollow','proSquad','mdetOpen','mdetVenue','mdetSave','pinEdit','delMatchAsk','playerNew','playerEdit','playerRestore','playerSave','playerRemove','importOpen','importParse','importAdd','importBack','importDel','matchNew','venue','matchNext','backDetails','cancelMatch','role','reason','restSub','toLive','editLineup','ko','pause','resume','endPeriod','nextPeriod','finishEarly','finish','ev','pick','oppSave','noteSave','evNew','evEdit','evSave','evDel','attSet','attAll','attMins','attEarly','attReason','sessNew','sessEdit','sessSave','sessDel','recMode','recDefault','pinAt','pinOwn','pinPos','pinSkip','pinEdit','pinsSet','pinsDefault','teamTap','capPick','capSet','capSkip','tapPlayer','tapBench','tapDo','tapOn','preset','fmt','prefill','formPick','luSel','luPitch','luPut','luList','injPick']);
function actExtra(a,ds,el){
  if(a.startsWith('pro')&&proAct(a,ds))return true;
  if(EDIT_ACTS.has(a)&&!canEdit()){toast('View only');return true}
  const adm=()=>canEdit()||(DB.user&&DB.user.isSuper);
  switch(a){
    case 'toastAct':{const f=TOAST_FN;TOAST_FN=null;const t=$('#toast');if(t)t.style.display='none';if(f)f();return true}
    case 'authMode':V.auth.mode=ds.v;V.auth.err='';render();return true;
    case 'authGo':doAuth();return true;
    case 'guestGo':doGuest();return true;
    case 'guestUp':doSignOut().then(()=>{V.auth.mode='up';render()});return true;
    case 'authLink':doLink();return true;
    case 'authLinkBack':V.auth.sent=false;V.auth.err='';render();return true;
    case 'syncNow':manualRender=true;toast('Syncing…');syncNow(true).finally(()=>{manualRender=false;if(SYNC.state==='ok')toast('Up to date');render()});return true;
    case 'reauth':V.sheet={kind:'reauth',d:{password:'',err:''}};renderSheet();return true;
    case 'reauthGo':doReauth();return true;
    case 'signOutAsk':if(isGuest()){doSignOut();return true}V.sheet={kind:'signout',d:{n:CLOUD?pendingCount():0}};renderSheet();return true;
    case 'signOutDo':doSignOut();return true;
    case 'delTeamOpen':{const t=S.team;if(!t||S.role!=='coach')return true;V.sheet={kind:'delTeam',d:{id:t.id,name:t.name,pro:!!(t.proOn&&t.proTeam)||t.age==='Professional',typed:''}};renderSheet();return true}
    case 'delTeamGo':{
      const d=V.sheet&&V.sheet.d;if(!d||d.busy)return true;
      if(!d.pro&&String(d.typed||'').trim().toLowerCase()!==String(d.name).trim().toLowerCase()){d.err='Type the team name exactly to confirm.';renderSheet();return true}
      d.busy=true;d.err='';renderSheet();
      rest('PATCH','/teams?id=eq.'+encodeURIComponent(d.id),{deleted:true},'return=minimal')
        .then(()=>{removeTeamLocal(d.id);V.sheet=null;V.tab='team';V.top=1;render();toast(d.name+' was removed.')})
        .catch(e=>{d.busy=false;d.err='Could not remove it ('+e.message+').';renderSheet()});
      return true}
    case 'proPickOpen':V.sheet={kind:'proPick',d:{q:''}};renderSheet();return true;
    case 'proPickClub':{
      const c=UK_CLUBS[+ds.i];if(!c)return true;const f=CLUB_INFO[c[0]]||[];
      V.draft=Object.assign({},V.draft,{name:c[0],age:'Professional',ground:f[2]||'',primary:f[0]||'#14243a',secondary:f[1]||'#ffffff',proOn:true,proTeam:clubSlug(c[0]),proClub:c[0],proName:c[0]});
      V.sheet=null;if(isGuest()){createTeamGuest();return true}V.proNew=true;createTeamCloud();return true}
    case 'newTeamOpen':V.newTeam=true;V.err='';render();return true;
    case 'newTeamBack':V.newTeam=false;V.err='';render();return true;
    case 'switchTeam':setCur(ds.id);V.tab='team';V.newTeam=false;V.top=1;V.err='';render();return true;
    case 'createTeam':{
      const t=V.draft;
      if(CLOUD){createTeamCloud();return true}
      if(!t.name.trim()){V.err='Give your team a name first.';render();return true}
      V.err='';const td=Object.assign(EMPTY(),{team:Object.assign({id:'local'},t,{name:t.name.trim()}),role:'coach'});
      DB.teams.local=td;DB.cur='local';S=td;save();V.tab='history';render();return true}
    case 'demoRole':S.role=ds.v;save();render();return true;
    case 'allTeamsOpen':
      V.sheet={kind:'allteams',d:{list:null}};renderSheet();
      rest('GET','/teams?select=id,name&deleted=eq.false&order=name').then(l=>{if(V.sheet&&V.sheet.kind==='allteams'){V.sheet.d.list=l;renderSheet()}}).catch(e=>{if(V.sheet&&V.sheet.kind==='allteams'){V.sheet.d.list=[];V.sheet.d.err=e.message;renderSheet()}});return true;
    case 'atView':{if(!DB.view.includes(ds.id))DB.view.push(ds.id);V.sheet=null;V.newTeam=false;syncWait().then(()=>{if(DB.teams[ds.id])setCur(ds.id);render()});return true}

    case 'pstat':V.sheet={kind:'pstat',d:{id:ds.id}};renderSheet();return true;
    case 'settings':V.sheet={kind:'settings',d:{}};renderSheet();return true;
    case 'pinAt':{const m=pinM();const e=pinEv(m,V.sheet.d.id);const L=window.LASTPT;if(!e||!L)return true;const r=el.getBoundingClientRect();const cl=(v,mx)=>+Math.max(0,Math.min(mx,v)).toFixed(1);pinSave(m,e,cl((L.x-r.left)/r.width*PW,PW),cl((L.y-r.top)/r.height*PH,PH));return true}
    case 'pinOwn':{const m=pinM();pinSave(m,pinEv(m,V.sheet.d.id),34,60);return true}
    case 'pinPos':{const m=pinM();const e=pinEv(m,V.sheet.d.id);const pid=V.sheet.d.step==='assist'?e.assistId:e.playerId;const xy=POSITIONS[posMap(m)[pid]];if(xy){const X=xy[0]/100*PW,Y=xy[1]/100*105;if(Y>PH)pinSave(m,e,34,60);else pinSave(m,e,+X.toFixed(1),+Y.toFixed(1))}return true}
    case 'pinSkip':{const m=pinM();pinNext(m,pinEv(m,V.sheet.d.id));return true}
    case 'mdetOpen':{const m=logMatch();if(!m)return true;V.sheet={kind:'mdet',d:{id:m.id,opp:m.opp||'',venue:m.venue||'home',location:m.location||'',comp:m.comp||'',referee:m.referee||'',attendance:m.attendance||'',date:m.date||'',time:m.time||'',periods:m.periods,periodMins:m.periodMins}};renderSheet();return true}
    case 'mdetVenue':{V.sheet.d.venue=ds.v;renderSheet();return true}
    case 'mdetSave':{const d=V.sheet.d;const m=S.matches.find(x=>x.id===d.id);if(!m)return true;
      if(!String(d.opp||'').trim()){d.err='Enter the opposition.';renderSheet();return true}
      const pr=+d.periods,pm=+d.periodMins;if(!(pr>=1&&pr<=4)||!(pm>=1&&pm<=120)){d.err='Periods 1 to 4, and 1 to 120 mins each.';renderSheet();return true}
      Object.assign(m,{opp:d.opp.trim(),venue:d.venue,location:(d.location||'').trim(),comp:(d.comp||'').trim(),referee:(d.referee||'').trim(),attendance:Math.max(0,Math.round(+d.attendance||0)),date:d.date||m.date,time:d.time||'',periods:pr,periodMins:pm});
      save();V.sheet={kind:'log'};render();return true}
    case 'pinEdit':V.sheet={kind:'where',d:{id:ds.id,step:'main',fromLog:true}};renderSheet();return true;
    case 'pinsSet':{const m=M();m.pins=ds.v==='on';DB.prefs.pins=m.pins;save();render();return true}
    case 'pinsDefault':DB.prefs.pins=ds.v==='on';save();render();return true;
    case 'balance':{V.sheet={kind:'bal',d:{}};renderSheet();return}
    case 'teamTap':{const m=M();const dd=+ds.d;
      if(dd>0){const st=curStamp(m);m.events.push({id:uid(),t:'tstat',how:ds.side,detail:ds.k,period:st.period,minute:st.minute,ts:Date.now()});buzz()}
      else{const c=m.events.map((e,i)=>[e,i]).filter(([e])=>e.t==='tstat'&&e.detail===ds.k&&e.how===ds.side).sort((a,b)=>(a[0].ts||0)-(b[0].ts||0)).pop();if(c)m.events.splice(c[1],1)}
      save();V.sheet.keepScroll=true;render();return true}
    case 'compSet':V.comp=ds.v;render();return true;
    case 'capPick':{V.sheet={kind:'captain',d:{}};renderSheet();return true}
    case 'capSet':case 'capSkip':{const m=M();const ko=V.sheet&&V.sheet.d&&V.sheet.d.ko;if(a==='capSet')m.captain=ds.id;else if(!ko)m.captain='';m.capAsked=true;V.sheet=null;save();render();if(ko)act('ko',{});return true}
    case 'ko':{const m=M();if(m&&!m.captain&&!m.capAsked&&Object.values(m.squad).some(r=>r.role==='starter')){m.capAsked=true;V.sheet={kind:'captain',d:{ko:true}};renderSheet();return true}return false}
    case 'teamSheet':V.ts=ds.id;V.sheet=null;render();window.scrollTo(0,0);return true;
    case 'tsBack':V.ts=null;render();return true;
    case 'tsPrint':try{window.print()}catch(e){toast('Printing is not available here. Use Share instead.')}return true;
    case 'tsShare':{const m=S.matches.find(x=>x.id===V.ts);const t=teamSheetText(m);if(navigator.share){navigator.share({title:'Team sheet',text:t}).catch(()=>{})}else{try{navigator.clipboard.writeText(t);toast('Team sheet copied')}catch(e){V.sheet={kind:'share',title:'Team sheet',d:{text:t}};renderSheet()}}return true}
    case 'setPref':DB.prefs[ds.k]=ds.v;save();applyTheme();render();return true;
    case 'setAccent':DB.prefs.accent=ds.i===''?null:[PRESETS[+ds.i][1],PRESETS[+ds.i][2]];save();applyTheme();render();return true;
    case 'prefill':{const m=M();prefillLineup(m,ds.v);save();render();return true}
    case 'formPick':{const m=M();const sp=startPos(m),ids=Object.keys(sp);const np=placePlayers(ids,slotsFor(ds.v,m.onPitch),sp);ids.forEach(id=>{m.squad[id].pos=np[id]});m.formation=ds.v;V.prefill='';save();render();return true}
    case 'luSel':{
      const m=M();const id=ds.id;
      if(!V.lsel){V.lsel=id;render();return true}
      if(V.lsel===id){V.lsel=null;render();return true}
      const a=V.lsel,ra=m.squad[a]&&m.squad[a].role,rb=m.squad[id]&&m.squad[id].role;
      if(ra==='starter'&&rb==='starter'){lineupDrop(a,'tok',id,null);return true}
      if(ra==='starter'){lineupDrop(id,'tok',a,null);return true}
      if(rb==='starter'){lineupDrop(a,'tok',id,null);return true}
      V.lsel=id;render();return true}
    case 'luPitch':{if(!V.lsel)return true;const pt=window.LASTPT?pitchPt(LASTPT.x,LASTPT.y):null;lineupDrop(V.lsel,'lu-pitch',null,pt);return true}
    case 'luPut':{if(!V.lsel)return true;lineupDrop(V.lsel,ds.to==='bench'?'lu-bench':'lu-out');return true}
    case 'luList':V.luList=!V.luList;render();return true;
    case 'lbSort':{const t=ds.t,c=+ds.c;V.lbs=V.lbs||{};const cur=V.lbs[t];V.lbs[t]=cur&&cur.c===c?{c,d:-cur.d}:{c,d:(c===0||(t==='Most minutes'||t==='Discipline')&&c===1)?1:-1};render();return true}
    case 'sortStats':{const dd=k=>(k==='num'||k==='name')?1:-1;if(V.sort===ds.v)V.sortDir=-(V.sortDir||dd(ds.v));else{V.sort=ds.v;V.sortDir=dd(ds.v)}render();return true}

    /* attendance */
    case 'attMode':V.attMode=ds.v;render();return true;
    case 'sessNew':V.sheet={kind:'sessNew',d:{kind:'training',title:'',date:todayStr(),time:nowHM(),location:S.team.ground||''}};renderSheet();return true;
    case 'sessEdit':{const x=S.sessions.find(q=>q.id===ds.id);V.sheet={kind:'sessEdit',d:{id:x.id,kind:x.kind,title:x.title,date:x.date,time:x.time,location:x.location}};renderSheet();return true}
    case 'sessKind':V.sheet.d.kind=ds.val;renderSheet();return true;
    case 'sessSave':{const d=V.sheet.d;
      if(d.id)Object.assign(S.sessions.find(q=>q.id===d.id),{kind:d.kind,title:d.title,date:d.date,time:d.time,location:d.location});
      else{const x={id:uid(),kind:d.kind,title:d.title||'',date:d.date||todayStr(),time:d.time||'',location:d.location||'',notes:'',records:{}};S.sessions.push(x);V.sess=x.id}
      save();V.sheet=null;render();return true}
    case 'sessOpen':V.sess=ds.id;render();return true;
    case 'sessBack':V.sess=null;render();return true;
    case 'sessDel':ask({title:'Delete this session?',msg:'Its attendance record is removed.',ok:'Delete',danger:true,fn:'delSession',arg:ds.id});return true;
    case 'attSet':{
      const x=S.sessions.find(q=>q.id===V.sess);const cur=x.records[ds.id];
      const state=!cur?'':cur.attended?(cur.late?'late':'in'):'out';
      if(state===ds.v){delete x.records[ds.id]}
      else{const r=cur||{attended:true,late:false,leftEarly:false,minsLate:'',minsEarly:'',reason:'',note:''};
        if(ds.v==='out'){r.attended=false;r.late=false;r.leftEarly=false;r.minsLate='';r.minsEarly=''}
        else{r.attended=true;r.late=ds.v==='late';r.reason='';if(!r.late)r.minsLate=''}
        x.records[ds.id]=r}
      save();render();return true}
    case 'attAll':{const x=S.sessions.find(q=>q.id===V.sess);activePlayers().forEach(p=>{if(!x.records[p.id])x.records[p.id]={attended:true,late:false,leftEarly:false,minsLate:'',minsEarly:'',reason:'',note:''}});save();render();return true}
    case 'attMins':{const r=S.sessions.find(q=>q.id===V.sess).records[ds.id];r[ds.f]=String(r[ds.f])===ds.val?'':ds.val;save();render();return true}
    case 'attEarly':{const r=S.sessions.find(q=>q.id===V.sess).records[ds.id];r.leftEarly=!r.leftEarly;if(!r.leftEarly)r.minsEarly='';save();render();return true}
    case 'attReason':{const r=S.sessions.find(q=>q.id===V.sess).records[ds.id];r.reason=r.reason===ds.val?'':ds.val;save();render();return true}

    /* log editing */
    case 'delMatchAsk':{const m=logMatch();if(!m)return true;ask({title:'Delete this match?',msg:'vs '+(m.opp||'opponent')+' on '+(m.date||'')+'. The score, lineup, every event and the stats from it will be removed for good. This cannot be undone.',ok:'Delete match',cancel:'Keep it',danger:true,fn:'delMatch',arg:m.id});return true}
    case 'logOpen':V.logId=ds.id||null;V.sheet={kind:'log'};renderSheet();return true;
    case 'evNew':{const mm=logMatch();const per=mm.clock&&mm.clock.state!=='ready'?Math.min(mm.clock.period,mm.periods):1;V.sheet={kind:'evEdit',d:{isNew:true,t:'goal',period:per,minute:'',how:'',playerId:'',assistId:''},err:''};renderSheet();return true}
    case 'evEdit':{const mm=logMatch();const e=mm.events.find(x=>x.id===ds.id);if(!e)return true;
      const d=Object.assign({},e,{playerId:e.playerId||'',assistId:e.assistId||'',how:e.how||'',detail:e.detail||'',offId:e.offId||'',onId:e.onId||''});
      if(e.t==='goal'&&e.how==='Opp own goal'){d.playerId='OPPOG'}
      V.sheet={kind:'evEdit',d,err:''};renderSheet();return true}
    case 'evSave':evSave();return true;
    case 'evBack':V.sheet={kind:'log'};renderSheet();return true;
    case 'evDel':ask({title:'Delete this event?',msg:'It will be removed from the log and the score will update.',ok:'Delete',danger:true,fn:'delEvent',arg:ds.id});return true;

    /* recording formats */
    case 'recMode':{const m=M();if(m)m.recMode=ds.v;DB.prefs.recMode=ds.v;save();render();return true}
    case 'continueLive':S.activeId=ds.id;V.tab='match';save();render();return true;
    case 'tapPlayer':case 'tapBench':{
      const m=M();if(!m)return true;
      if(m.clock.state==='ready'){toast('Kick off first, or use Edit team');return true}
      V.sheet={kind:a==='tapPlayer'?'tap':'tapbench',d:{pid:ds.id}};renderSheet();return true}
    case 'tapDo':startFlow(ds.k,V.sheet.d.pid);return true;
    case 'tapOn':V.sheet={kind:'sub',step:2,d:{off:ds.id,on:V.sheet.d.pid}};renderSheet();return true;
  }
  return false;
}

async function proLoad(force){

  if(!force&&PRO.at&&Date.now()-PRO.at<300000){proAutoSquad();proSeasonLoad();return}
  PRO.busy=true;PRO.err='';PRO.tried=slug;render();
  try{
    PRO.matches=await rest('GET','/pro_matches?select=source,source_ref,teams,comp,match_date,kickoff,home,away,home_goals,away_goals,status,raw_status,venue,attendance,referee,home_manager,away_manager,home_formation,away_formation,detail_fetched_at&teams=cs.%7B'+encodeURIComponent(slug)+'%7D&order=match_date.asc&limit=500')||[];

function proRound(m){
  const c=String(m.comp||'');const i=c.indexOf(' - ');if(i<0)return '';
  const base=c.slice(0,i).trim(),ex=c.slice(i+3).trim();
  if(/phase|stage|league|group|regular/i.test(ex)&&!/cup|final/i.test(ex)){
    const same=PRO.matches.filter(x=>String(x.comp||'').split(' - ')[0].trim()===base&&x.status!=='other').sort((a,b)=>(a.match_date+(a.kickoff||'')).localeCompare(b.match_date+(b.kickoff||'')));
    const n=same.findIndex(x=>proKey(x)===proKey(m));

const proComp=m=>{const b=String(m.comp||'').split(' - ')[0].trim(),r=proRound(m);return [b,r].filter(Boolean).join(' · ')};
/* neutral venue: cup semi-finals and finals are played away from either club's ground; the feed has no venue flag, so this goes by the round */
const proNeutral=m=>{const r=proRound(m)+' '+String(m.comp||'');return /semi|final/i.test(r)&&!/quarter/i.test(r)};

function proDateTile(m){
  const d=String(m.match_date||'');const day=d.length>=10?String(parseInt(d.slice(8,10),10)):'';
  const mon=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][parseInt(d.slice(5,7),10)-1]||'';
  const tm=m.kickoff?String(m.kickoff).slice(0,5):'TBC';
  const st=proNeutral(m)?'background:#9aa6a0;color:#fff;border:2px solid #9aa6a0':proClubSide(m)==='home'?'background:var(--p);color:var(--pt);border:2px solid var(--s)':'background:var(--s);color:var(--st);border:2px solid var(--p)';
  return `<div class="num dt" style="${st}"><b>${esc(day)}</b><span>${mon}</span><span>${esc(tm)}</span></div>`;
}
/* a shoot-out is recorded only in the feed's status text, e.g. "Full time , Fleetwood Town win 5 - 3 on penalties" */
function proPens(m){
  const x=String(m.raw_status||'').match(/,\s*(.+?)\s+win\s+(\d+)\s*-\s*(\d+)\s+on penalties/i);
  if(!x)return null;
  const wk=clubKey(x[1]),hk=clubKey(m.home);
  const homeWon=!!(wk&&hk&&(hk.includes(wk)||wk.includes(hk)));
  const w=+x[2],l=+x[3],c=String(m.comp||'');
  return {home:homeWon?w:l,away:homeWon?l:w,winner:homeWon?'home':'away',et:/cup|final/i.test(c)&&!/friend|emirates/i.test(c)};
}
/* our result from the club's side: a shoot-out decides a level game */
function proResult(m,side){
  const us=side==='home'?m.home_goals:m.away_goals,them=side==='home'?m.away_goals:m.home_goals;
  const p=proPens(m);let res=us>them?'W':us<them?'L':'D',pen=null;
  if(p){pen={us:side==='home'?p.home:p.away,them:side==='home'?p.away:p.home};res=p.winner===side?'W':'L'}
  return {us,them,res,pen,et:!!(p&&p.et)};
}

  const factsHtml=facts.length?`<div class="card" style="padding:6px 14px">${facts.map(f=>`<div class="irow"><span class="stat" style="width:130px">${f[0]}</span><b class="fv">${esc(f[1])}</b></div>`).join('')}</div>`:'';
  const nm=s=>s==='home'?m.home:m.away;
  const hdr=`<header class="top"><div class="hrow"><button data-act="proClose" style="background:rgba(255,255,255,.2);color:var(--pt);min-width:44px;padding:0">‹</button><div style="flex:1;min-width:0">${S.team?`<div class="tn">${esc(S.team.name)}</div>`:''}<h1>Match</h1><div class="sub">${esc(proDate(m.match_date))}</div></div></div></header>`;
  const pn=fin?proPens(m):null;
  const R=fin&&m.home_goals!=null&&S.team&&S.team.proTeam?proResult(m,proClubSide(m)):null;
  const resLbl=R?(R.res==='W'?'Win':R.res==='L'?'Loss':'Draw'):'';
  const resCol=R?(R.res==='W'?'var(--ok)':R.res==='L'?'var(--bad)':'var(--warn)'):'';
  const stTxt=fin?(pn&&pn.et?'After extra time':'Full time'):m.status==='live'?'Live':m.status==='other'?esc(m.raw_status||'Not played'):'Kick-off '+esc(String(m.kickoff||'').slice(0,5)||'TBC');
  const hero=`<div class="hero">${R?`<span class="res" style="background:${resCol};color:#fff;margin-right:6px">${resLbl}</span>`:''}<span class="res"${R?' style="background:var(--mute);color:#fff"':''}>${stTxt}</span><div class="big">${fin?`${m.home_goals} – ${m.away_goals}`:'v'}</div>${pn?`<div class="pens">${esc(nm(pn.winner))} won ${pn.winner==='home'?pn.home:pn.away}–${pn.winner==='home'?pn.away:pn.home} on penalties</div>`:''}<div style="font-weight:700">${esc(m.home)} v ${esc(m.away)}</div><div class="meta">${esc(meta)}</div></div>${factsHtml}`;
  if(!d)return hdr+`<main>${hero}${PRO.err?`<div class="err">${esc(PRO.err)}</div>`:''}${fin?`<div class="empty">${PRO.busy?'<b>Loading…</b>':'<b>Detail not on this device</b>Connect to the internet to load goals, cards and line-ups.'}</div>`:'<div class="empty">Line-ups and events appear after the game.</div>'}</main>`;
  const ev=d.events;
  const row=(e,txt)=>`<div class="irow"><b>${e.minute}'</b><span>${txt}</span></div>`;
  const sec=(t,rows)=>rows.length?`<h2>${t}</h2><div class="card" style="padding:6px 14px">${rows.join('')}</div>`:'';
  const goals=ev.filter(e=>e.type==='goal'||e.type==='own_goal').map(e=>row(e,`<b style="width:auto">${esc(e.player)}</b>${e.type==='own_goal'?' <span class="stat">own goal</span>':e.detail?` <span class="stat">${esc(e.detail)}</span>`:''} <span class="stat">· ${esc(nm(e.side))}</span>${e.assist?`<br><span class="stat">assist ${esc(e.assist)}</span>`:''}`));
  const cards=ev.filter(e=>e.type==='yellow'||e.type==='red').map(e=>row(e,`${e.type==='yellow'?'🟨':'🟥'} ${esc(e.player)}${e.detail?` <span class="stat">${esc(e.detail)}</span>`:''} <span class="stat">· ${esc(nm(e.side))}</span>`));
  const subs=ev.filter(e=>e.type==='sub').map(e=>row(e,`↑ ${esc(e.on_player||'')}<br>↓ ${esc(e.player)} <span class="stat">· ${esc(nm(e.side))}</span>`));
  const side=s=>{
    const ps=d.players.filter(p=>p.side===s);if(!ps.length)return '';
    const line=p=>`<div class="irow"><b style="width:34px">${p.num}</b><span>${esc(p.name)}${p.captain?' <span class="stat">(C)</span>':''} <span class="stat">${esc(p.pos||'')}</span>${(p.yellow||[]).map(x=>` <span class="stat">🟨${x}'</span>`).join('')}${(p.red||[]).map(x=>` <span class="stat">🟥${x}'</span>`).join('')}${p.off_min!=null?` <span class="stat">↓${p.off_min}'</span>`:''}${p.on_min!=null?` <span class="stat">↑${p.on_min}'</span>`:''}</span></div>`;
    const fm=s==='home'?m.home_formation:m.away_formation,mg=s==='home'?m.home_manager:m.away_manager;
    return `<div class="card" style="padding:6px 14px"><div class="lbl" style="margin-top:8px"><b style="color:var(--ink)">${esc(nm(s))}</b>${fm?' · '+esc(fm):''}${mg?' · '+esc(mg):''}</div>${ps.filter(p=>p.starter).map(line).join('')}<div class="lbl" style="margin-top:10px">Substitutes</div>${ps.filter(p=>!p.starter).map(line).join('')}</div>`;
  };
  const lu=side('home')+side('away');
  return hdr+`<main>${hero}${PRO.err?`<div class="err">${esc(PRO.err)}</div>`:''}${sec('Goals',goals)}${sec('Cards',cards)}${sec('Substitutions',subs)}${lu?`<h2>Line-ups</h2><div class="cols">${lu}</div>`:''}${!ev.length&&!d.players.length?'<div class="empty">No detail was published for this game.</div>':''}</main>`;
}
function proView(){
  const m=PRO.ref&&PRO.matches.find(x=>proKey(x)===PRO.ref);
  return m?proDetailView(m):historyView();
}
/* ---------- stats from the feed: season line-ups and goals for a followed club, matched to your squad by name ---------- */
const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function feedPid(name,num,ps){
  const n=nrm(name);if(!n)return null;const tk=n.split(' '),last=tk[tk.length-1],first=tk[0];
  let hit=ps.find(p=>nrm(p.name)===n);if(hit)return hit.id;
  hit=ps.find(p=>{const q=nrm(p.name).split(' '),ql=q[q.length-1];return ql===last&&(q[0]===first||q[0][0]===first[0]||q.length===1||tk.length===1)});if(hit)return hit.id;
  hit=ps.find(p=>p.num===num&&nrm(p.name).split(' ').some(w=>w.length>2&&tk.includes(w)));if(hit)return hit.id;
  const same=ps.filter(p=>{const q=nrm(p.name).split(' ');return q[q.length-1]===last});
  return same.length===1?same[0].id:null;
}
const proClubSide=m=>{const ck=clubKey(S.team&&S.team.proClub);return (clubKey(m.home)===ck||(ck&&clubKey(m.home).includes(ck)))?'home':'away'};
async function proSeasonLoad(force){
  const t=S.team;if(!CLOUD||!DB.user||!t||!t.proTeam||PRO.sbusy)return;
  const fin=PRO.matches.filter(m=>m.status==='finished');if(!fin.length)return;
  const sig=fin.length+'|'+t.proTeam+'|v2';
  if(!force&&PRO.season&&PRO.season.sig===sig&&Date.now()-PRO.season.at<3600000)return;
  PRO.sbusy=true;
  try{
    const pl=[],ev=[];
    for(let i=0;i<fin.length;i+=25){
      const refs=fin.slice(i,i+25).map(m=>'"'+m.source_ref+'"').join(',');const f='source_ref=in.('+encodeURIComponent(refs)+')';
      pl.push(...(await rest('GET','/pro_match_players?select=source_ref,side,num,name,pos,starter,on_min,off_min,yellow,red&'+f+'&limit=5000')||[]));
      ev.push(...(await rest('GET','/pro_match_events?select=source_ref,type,side,minute,player,assist,detail&type=in.(goal,own_goal)&'+f+'&limit=5000')||[]));
    }
    PRO.season={sig,at:Date.now(),slug:t.proTeam,pl,ev};proSave();
  }catch(e){PRO.err=navigator.onLine?'Could not load season stats ('+e.message+').':''}
  PRO.sbusy=false;FEED.key='';render();
}
const FEED={key:'',map:{},n:0};
function feedMap(){
  const t=S.team;
  if(!CLOUD||!t||!t.proTeam||!PRO.season||PRO.season.slug!==t.proTeam)return {};
  const ps=activePlayers();
  const key=PRO.season.at+'|'+(V.comp||'')+'|'+S.matches.length+'|'+ps.map(p=>p.id+p.num+p.name).join(',');
  if(FEED.key===key)return FEED.map;
  const map={};let n=0;const get=id=>map[id]||(map[id]={sel:0,played:0,started:0,mins:0,goals:0,assists:0,yc:0,rc:0});
  const byRef={};PRO.season.pl.forEach(x=>{(byRef[x.source_ref]=byRef[x.source_ref]||[]).push(x)});
  const evRef={};PRO.season.ev.forEach(x=>{(evRef[x.source_ref]=evRef[x.source_ref]||[]).push(x)});
  for(const m of PRO.matches){
    if(m.status!=='finished'||proRecorded(m)||(V.comp&&compNorm(m.comp)!==V.comp))continue;
    const side=proClubSide(m),rows=(byRef[m.source_ref]||[]).filter(x=>x.side===side);
    if(!rows.length&&!(evRef[m.source_ref]||[]).length)continue;
    n++;
    rows.forEach(x=>{
      const id=feedPid(x.name,x.num,ps);if(!id)return;const o=get(id);
      o.sel++;
      const on=x.starter||x.on_min!=null;
      if(on){o.played++;if(x.starter)o.started++;const st=x.starter?0:x.on_min,en=x.off_min!=null?x.off_min:90;o.mins+=Math.max(0,Math.min(en,120)-st)}
      o.yc+=(x.yellow||[]).length;o.rc+=(x.red||[]).length;
    });
    (evRef[m.source_ref]||[]).filter(e=>e.side===side&&e.type==='goal').forEach(e=>{
      const a=feedPid(e.player,null,ps);if(a)get(a).goals++;
      if(e.assist){const b=feedPid(e.assist,null,ps);if(b)get(b).assists++}
    });
  }
  FEED.key=key;FEED.map=map;FEED.n=n;return map;
}
const feedGames=()=>{feedMap();return FEED.n};
const POSMAP=p=>{const x=String(p||'').toLowerCase();return /goalkeeper|keeper/.test(x)?'GK':/back|defend/.test(x)?'DEF':/midfield/.test(x)?'MID':/striker|forward|winger|attack(er)?$/.test(x)?'FWD':''};
async function proFillSquad(quiet){
  const t=S.team;if(!t||!t.proTeam||PRO.busy)return;
  const ck=clubKey(t.proClub);const fin=PRO.matches.filter(m=>m.status==='finished').sort((a,b)=>b.match_date.localeCompare(a.match_date));
  if(!fin.length){if(!quiet)toast('No games imported for this club yet. Try again after the next feed.');return}
  PRO.busy=true;render();let got=null;
  try{
    if(!PRO.season||PRO.season.slug!==t.proTeam){PRO.busy=false;await proSeasonLoad(true);PRO.busy=true}
    if(PRO.season&&PRO.season.slug===t.proTeam){ // the whole squad: everyone named in any line-up this season, newest number first
      const dateOf={};PRO.matches.forEach(m=>{dateOf[m.source_ref]=[m.match_date,proClubSide(m)]});
      const seen=new Set(),rows=PRO.season.pl.filter(x=>dateOf[x.source_ref]&&dateOf[x.source_ref][1]===x.side).sort((a,b)=>dateOf[b.source_ref][0].localeCompare(dateOf[a.source_ref][0]));
      const bestPos={};rows.forEach(x=>{const k=nrm(x.name);if(!bestPos[k]&&x.pos&&x.pos!=='Substitute')bestPos[k]=x.pos});
      const all=[];rows.forEach(x=>{const k=nrm(x.name);if(k&&!seen.has(k)){seen.add(k);all.push({num:x.num,name:x.name,pos:bestPos[k]||x.pos})}});
      if(all.length)got=all;
    }
    if(!got)
    for(const m of fin.slice(0,6)){
      const home=clubKey(m.home)===ck||(ck&&clubKey(m.home).includes(ck));
      const q='source=eq.'+encodeURIComponent(m.source)+'&source_ref=eq.'+encodeURIComponent(m.source_ref)+'&side=eq.'+(home?'home':'away');
      const pl=await rest('GET','/pro_match_players?select=num,name,pos&'+q+'&order=num.asc');
      if(pl&&pl.length){got=pl;break}
    }
  }catch(e){PRO.busy=false;render();toast('Could not read the line-up ('+e.message+').');return}
  PRO.busy=false;
  if(!got){render();if(!quiet)toast('No line-ups published yet for this club.');return}
  let n=0;const have=activePlayers();
  got.forEach(p=>{
    const num=+p.num,name=String(p.name||'').trim();
    if(!name||!(num>=0&&num<=99))return;
    if(have.some(x=>x.num===num||x.name.toLowerCase()===name.toLowerCase()))return;
    const pl={id:uid(),num,name,pos:POSMAP(p.pos),left:false,screen:'',start:'',end:'',injured:false,injNote:'',ret:''};
    S.players.push(pl);have.push(pl);n++;
  });
  save();render();toast(n?'Added '+n+' player'+(n===1?'':'s')+' from the latest line-up.':'Everyone in the latest line-up is already in the squad.');
}
function proAct(a,ds){
  switch(a){
    case 'proOpen':{const m=PRO.matches.find(x=>proKey(x)===ds.id);if(!m)return true;V.tab='pro';PRO.ref=ds.id;PRO.err='';V.top=1;render();if(m.status==='finished'&&!PRO.detail[ds.id])proDetail(m);return true}
    case 'proSquad':proFillSquad();return true;
    case 'proClose':PRO.ref=null;PRO.err='';V.tab='history';V.top=1;render();return true;
  }
  return false;
}

/* ---------- render ---------- */
function render(){
  applyTheme();
  try{if(CLOUD&&DB.user&&S&&S.team&&S.team.proTeam&&PRO.tried!==S.team.proTeam&&!PRO.busy)setTimeout(()=>proLoad(),0)}catch(e){}
  try{repairMatches()}catch(e){}
  const app=$('#app');
  const bd=document.body.dataset;
  if(CLOUD&&DB.user&&S&&S.team&&!S.team.proTeam&&SYNC.state!=='syncing'){ // this app only shows professional clubs
    const pid=Object.keys(DB.teams).find(k=>DB.teams[k]&&DB.teams[k].team&&DB.teams[k].team.proTeam);
    if(pid)setCur(pid);else S=EMPTY()}
  bd.view=(CLOUD&&!DB.user)?'auth':(!S.team||V.newTeam)?'noteam':'app';bd.tab=V.tab;try{localStorage.setItem('myteamcompanion-view',V.tab==='pro'?'history':V.tab)}catch(e){}
  if(CLOUD&&!DB.user){app.innerHTML=authView();renderSheet();return}
  if(!S.team||V.newTeam){app.innerHTML=CLOUD?noTeamView():onboard();renderSheet();return}
  let body='';
  if(V.ts&&S.matches.find(x=>x.id===V.ts))body=teamSheetView(S.matches.find(x=>x.id===V.ts));
  else if(V.tab==='team')body=teamView();
  else if(V.tab==='links')body=linksView();
  else if(V.tab==='stats')body=statsView();
  else if(V.tab==='pro')body=proView();
  else if(V.tab==='history')body=historyView();
  else body=historyView();
  app.innerHTML=body+tabbar();
  document.body.classList.remove('mb');
  renderSheet();
  fitForm();
  const ck=$('#clock');if(ck)fitClock(ck);
  fitLive();
  if(V.top){V.top=0;window.scrollTo(0,0)}
}

function capClock(m){
  const c=m&&m.clock;if(!c||c.state!=='running'||!canEdit())return;
  const cap=m.periodMins*60000*1.5;
  if(elapsedMs(m)>cap){c.accMs=cap;c.startedAt=null;c.state='paused';save();toast('Clock paused: this period is 50% over its length. Resume it if play is still going.');render()}
}
setInterval(()=>{
  try{capClock(M())}catch(e){}
  const m=M()||(!canEdit()&&liveOther());if(!m||m.status!=='live'||V.tab!=='match')return;
  const c=$('#clock');if(c){c.textContent=fmtClock(m);fitClock(c)}
  if(++TICK%40===0){const t=$('#ptab');if(t&&!V.sheet)t.innerHTML=liveTable(m);const mp=gmMap(m);document.querySelectorAll('.gm[data-gm]').forEach(g=>{const v=mp[g.dataset.gm];if(v!==undefined)g.textContent=v+"'"})}
},250);
let TICK=0;
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const m=M();if(m&&m.status==='live'&&m.clock.state==='running')lockScreen();const c=$('#clock');if(c&&m)c.textContent=fmtClock(m)}});

render();
finishLink();
if(CLOUD&&DB.user)setTimeout(()=>syncNow(),300);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.__myteamcompanion={balancePlan,liveRows,describe,posMap,startPos,prefillLineup,placePlayers,formSlots,movePos,lineupDrop,poolFor,fmtN,nearestPos,minsPlayed,matchEnd,stats,matchSummary,applyRows,S:()=>S,DB:()=>DB,V,act,render,parseRoster,syncNow,rowsFor,pendingCount};
})();
</script>
