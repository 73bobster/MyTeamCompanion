<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTeamCompanion">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MyTeamCompanion</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:800;font-style:normal;font-display:swap;src:url(fonts/manrope-800.woff2) format("woff2")}
:root{--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--head:Manrope,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--brand-blue:#315fea;--brand-pink:#f05a8d;--p:#14243a;--pt:#fff;--s:#f05a8d;--act:#315fea;--st:#111;--bg:#eef2f7;--card:#fff;--ink:#14243a;--mute:#5b6b82;--line:#dbe2ec;--bad:#c0392b;--ok:#1e8f4e;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{background:var(--p);color:var(--pt);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--s)}
h1,h2{font-family:var(--head);font-weight:800}
header.top h1{margin:0;font-size:20px;line-height:1.2}
.bm{display:inline-flex;width:58px;flex:none}.bm svg{width:100%;height:auto;display:block}
header.top .sub{font-size:13px;opacity:.85}
header.top .tn{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .hrow{display:flex;align-items:center;gap:12px}
main{padding:14px 16px}
h2{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:5px;min-height:48px;padding:10px 12px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px}
input[type=color]{padding:3px;height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:0 16px;cursor:pointer;color:var(--ink);background:#e9eeeb}
button:active{transform:scale(.98)}
button[disabled]{opacity:.45}
.btn{background:var(--act,var(--p));color:var(--pt);font-weight:700}
a{color:var(--brand-blue)}
h3,.score,header.top .tn{font-family:var(--head);font-weight:800}
header.top .bmk{display:inline-flex;width:40px;flex:none;opacity:.95}header.top .bmk svg{width:100%;height:auto;display:block}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:600}
.btn.bad{background:var(--bad);color:#fff;font-weight:700}
.btn.block{display:block;width:100%}
.btn.lg{min-height:60px;font-size:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{min-height:44px;padding:0 14px;background:#fff;border:2px solid var(--line);border-radius:22px;font-weight:600}
.chips button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
.chips.small button{min-height:38px;font-size:14px;padding:0 12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.crest{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p);color:var(--pt);border:3px solid var(--s);font-weight:800;flex:none;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.22)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;background:none;border-radius:0;min-height:62px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button i{font-style:normal;font-size:22px}
.tabs button.on{color:var(--act,var(--p))}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.prow .num{width:44px;height:44px;border-radius:12px;background:var(--p);color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none}
.prow .nm{flex:1;min-width:0;font-weight:600}
.prow .nm small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.prow .num.dt{width:54px;height:auto;min-height:60px;padding:5px 0;flex-direction:column;gap:1px;line-height:1.1;font-size:inherit}
.prow .num.dt b{font-size:19px;font-weight:800}
.prow .num.dt span{font-size:11px;font-weight:700;letter-spacing:.04em}
.prow.out .num{background:#9aa6a0}
.prow.sub .num{background:var(--s);color:var(--st);border:2px solid var(--p)}
.seg3{display:flex;gap:4px;flex:none}
.seg3 button{min-height:44px;min-width:50px;padding:0 8px;font-size:14px;font-weight:700;background:#eef2ef;border-radius:10px}
.seg3 button.on{background:var(--p);color:var(--pt)}
.seg3 button.on.o{background:#6b7770;color:#fff}
.seg3 button.on.b{background:var(--s);color:var(--st);outline:2px solid var(--p)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:#fff;border:2px solid var(--line);font-weight:700}
.seg button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
.count{position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:5px 11px;border-radius:20px;font-size:13px;font-weight:700;background:#e4e9e6}
.pill.ok{background:#d9f2e3;color:#14663a}.pill.warn{background:#fdf0d2;color:#8a5a00}.pill.bad{background:#fbdcd8;color:#8e2418}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sb .tm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.sb .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .tm.r{justify-content:flex-end;text-align:right}
.score{font-size:40px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clockbar{text-align:center;padding:10px 0 6px}
.clock{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pname{font-size:14px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.evg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0;grid-auto-rows:1fr;height:var(--evh,auto)}
.evg button{min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;border-radius:14px}
.evg button i{font-style:normal;font-size:24px}
.evg button.big{min-height:92px;font-size:16px}
.evg .big.g{background:var(--p);color:var(--pt);border-color:var(--p);grid-column:span 2}
.evg .big.a{background:#d32f2f;color:#fff;border-color:#d32f2f;grid-column:span 1}
.log{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.log .mn{width:52px;flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.log .tx{flex:1;min-width:0}.log .tx small{display:block;color:var(--mute)}
.log button{min-height:40px;min-width:40px;padding:0 8px;background:#eef2ef}
#sheet{position:fixed;inset:0;background:rgba(10,20,15,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.sheet-in{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-h h3{margin:0;flex:1;font-size:19px}
.sheet-h button{min-height:44px;min-width:44px;padding:0 10px;background:#eef2ef}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.pb{min-height:66px;background:#fff;border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:0}
.pb{position:relative}.pb .pbx{position:absolute;top:4px;right:4px;text-decoration:none;line-height:1}.pb .pbx .rx{background:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 0 0 1px #d32f2f;color:#d32f2f}
.pb b{font-size:24px;line-height:1.1}.pb span{font-size:13px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb.alt{background:#f3f5f4;border-style:dashed}
.big-in{font-size:22px;text-align:center}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:6px 0}
.note{font-size:13px;color:var(--mute);margin:6px 0 14px}
.hero{text-align:center;padding:22px 10px 8px}
.hero .res{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;background:var(--p);color:var(--pt)}
.hero .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.hero .meta{color:var(--mute);font-size:14px}
.irow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.irow:last-child{border:0}
.irow b{width:56px;flex:none;font-variant-numeric:tabular-nums}
.irow b.fv{width:auto;flex:1;min-width:0;text-align:right;font-weight:600}
.hero .pens{font-weight:700;margin:2px 0 6px}
a.prow{text-decoration:none;color:inherit}
.tabs button{min-width:0;padding-left:2px;padding-right:2px}
.chart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.chart h3{margin:0 0 6px;font-size:14px}
.chart svg{display:block;width:100%;height:auto}
.cl{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}
.cl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.hb .l{width:38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{flex:1;display:flex;height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.hb .t span{display:block;height:100%}
.hb .v{width:30px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.stat{font-size:12px;color:var(--mute)}
.ocrbox{border:2px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:12px;text-align:center}
.ocrbox input{display:none}
.ocrbox label{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;margin:0;border-radius:12px;background:var(--p);color:var(--pt);font-size:16px;font-weight:700;cursor:pointer}
.bad-in{border-color:var(--bad)!important}
a{color:var(--p);font-weight:600}
.linkbtn{background:none;color:var(--mute);text-decoration:underline;min-height:44px;font-weight:600}

.sbadge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:14px;background:rgba(255,255,255,.2);color:var(--pt);white-space:nowrap;flex:none}
.sbadge.ok{background:rgba(255,255,255,.2)}.sbadge.warn{background:#fdf0d2;color:#8a5a00}.sbadge.bad{background:#fbdcd8;color:#8e2418}
.tabs button{min-width:0;padding:0 2px;font-size:11px}.tabs button i{font-size:20px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
.tbl table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--mute);background:#f7f9f8;position:sticky;top:0}
.tbl td.n,.tbl th.n{position:sticky;left:0;background:#fff;font-weight:800;z-index:1}
.tbl th.n{background:#f7f9f8}
.tbl td.nm,.tbl th.nm{position:sticky;left:42px;background:#fff;text-align:left;font-weight:600;z-index:1;box-shadow:2px 0 3px rgba(0,0,0,.05);min-width:104px}
.tbl th.nm{background:#f7f9f8}
.tbl.lb td.nm,.tbl.lb th.nm{left:0}
.tbl tr[data-act]{cursor:pointer}
.tbl tfoot td{font-weight:800;background:#f7f9f8}
.pitchwrap{margin:6px 0 10px}
.pitch{position:relative;border-radius:16px;background:#2e8b4a;overflow:hidden;height:370px;border:3px solid #1f6b37;display:flex;flex-direction:column;justify-content:space-around;padding:38px 4px 8px;user-select:none;-webkit-user-select:none}
.pitch::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 46px,transparent 46px 92px)}
.pitch .pl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pitch .line{position:relative;display:flex;justify-content:space-evenly;align-items:center}
.goalmouth{position:absolute;top:0;left:50%;transform:translateX(-50%);width:52%;height:34px;border:3px solid #fff;border-top:0;border-radius:0 0 8px 8px;background:rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
.tk{width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none;cursor:pointer}
.tk[data-drag]{touch-action:none;cursor:grab}
.tk b{position:relative;width:42px;height:42px;border-radius:50%;background:var(--p);color:var(--pt);border:3px solid var(--s);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tk b em{position:absolute;top:-9px;right:-12px;font-style:normal;font-size:12px;background:#fff;color:#111;border-radius:10px;padding:0 3px}
.tk b u{position:absolute;top:-4px;left:-5px;width:10px;height:14px;background:#f5c518;border-radius:2px;border:1px solid #8a6d00}
.tk span{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#dfe7e2;border-radius:14px;min-height:84px;align-items:center;margin-bottom:10px}
.bench .tk span{color:var(--ink);text-shadow:none}
.bench .bl{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg);flex:none}
.bench i{font-style:normal;color:var(--mute);font-size:14px}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.dz{min-height:58px;border:2px dashed #aab5ae;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mute);background:#fff}
.dz i{font-style:normal;font-size:20px}
.drop-on{outline:4px solid var(--p);outline-offset:-2px;background:#d9f2e3!important}
.pitch .drop-on{outline-color:#fff}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-70%);opacity:.92}
.clock.sm{font-size:40px}.clockbar.sm{padding:4px 0}
.hint{font-size:12px;color:var(--mute);margin:-2px 0 10px}
.chips.small.tight{margin-bottom:6px}
.att{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.att .top{display:flex;align-items:center;gap:12px}
.att .num{width:40px;height:40px;border-radius:11px;background:var(--p);color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.att .nm{flex:1;min-width:0;font-weight:600}
.att.in .num{background:var(--ok)}.att.late .num{background:var(--warn)}.att.out .num{background:#9aa6a0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:#e4e9e6;margin-right:4px}
.tag.ok{background:#d9f2e3;color:#14663a}.tag.warn{background:#fdf0d2;color:#8a5a00}.tag.bad{background:#fbdcd8;color:#8e2418}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600;background:#fdf0d2;color:#6b4700}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset[disabled] input,fieldset[disabled] select,fieldset[disabled] textarea,fieldset[disabled] button.sw{opacity:.7}
#toast button{pointer-events:auto;background:rgba(255,255,255,.2);color:#fff;min-height:32px;margin-left:12px;padding:0 12px;border-radius:16px;font-weight:700}

/* ---------- responsive: small phone → desktop ---------- */
html{-webkit-text-size-adjust:100%}
.pitch{height:clamp(300px,46vh,560px)}
.tk{width:clamp(50px,15vw,64px)}
.tk b{width:clamp(38px,11vw,48px);height:clamp(38px,11vw,48px)}
.lv{display:block}
.cols{display:block}
@media (max-width:380px){
  .tabs button{font-size:10px}.tabs button i{font-size:18px}
  .clock{font-size:46px}.score{font-size:34px}
  .evg{gap:8px}.evg button{min-height:66px;font-size:13px}
  .att .top{flex-wrap:wrap}.att .seg3{width:100%}.att .seg3 button{flex:1}
  main{padding-left:12px;padding-right:12px}
  .tray{grid-template-columns:repeat(3,1fr)}
  .tbl th,.tbl td{padding:8px 6px}
}
@media (min-width:600px){
  html{font-size:17px}
  #app{max-width:none}.tabs div{max-width:820px}
  main{max-width:820px;margin:0 auto;padding:18px 24px}
  header.top{padding-left:24px;padding-right:24px}
  header.top .hrow,header.top .sb{max-width:772px;margin:0 auto}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  #sheet{align-items:center}
  .sheet-in{border-radius:22px;max-width:620px;max-height:86vh;padding:18px 22px}
  .pitch{height:clamp(380px,56vh,620px)}
  .tk{width:68px}.tk b{width:50px;height:50px;font-size:19px}.tk span{font-size:12px;max-width:70px}
  .evg button{min-height:84px;font-size:15px}
  .btn.lg{min-height:64px}
  .tabs button{font-size:13px}
  #toast{top:76px!important}
}
@media (min-width:600px) and (orientation:landscape) and (max-width:1023px){
  .lv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 20px;align-items:start}
  .pitch{height:clamp(340px,60vh,560px)}
}
@media (min-width:1024px){
  html{font-size:17px}
  #app{max-width:none;margin:0 0 0 232px;padding-bottom:28px}
  .tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:0}
  .tabs div{flex-direction:column;max-width:none;margin:0;padding:18px 12px;gap:4px}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;min-height:54px;padding:0 16px;font-size:16px;border-radius:12px;text-align:left}

function elapsedMs(m){const c=m.clock;return c.accMs+(c.state==='running'?Date.now()-c.startedAt:0)}
function pname(m,n){if(m.periods===2)return n===1?'1st half':'2nd half';if(m.periods===4)return 'Quarter '+n;return 'Period '+n}
function curStamp(m){
  const c=m.clock;const base=(c.period-1)*m.periodMins;
  if(c.state==='ready')return{period:c.period,minute:0};
  return{period:c.period,minute:base+Math.floor(elapsedMs(m)/60000)+1};
}
function fmtMin(e,m){
  const end=e.period*m.periodMins;
  if(e.minute>end&&m.periods>0)return end+'+'+(e.minute-end)+"'";
  return e.minute+"'";
}
function fmtClock(m){
  const base=(m.clock.period-1)*m.periodMins*60000;
  const t=Math.floor((base+elapsedMs(m))/1000);
  return pad(Math.floor(t/60))+':'+pad(t%60);
}
function pitchSet(m){
  const set=new Set(Object.keys(m.squad).filter(id=>m.squad[id].role==='starter'));
  for(const e of m.events){
    if(e.t==='sub'){set.delete(e.offId);set.add(e.onId)}
    if(e.t==='red'&&e.playerId)set.delete(e.playerId);
  }
  return set;
}
const gone=(m,id)=>m.status==='live'&&P(id)&&!availOn(P(id),m.date)&&!m.events.some(e=>e.playerId===id||e.assistId===id||e.offId===id||e.onId===id);
function benchIds(m){
  const on=pitchSet(m);const sentOff=new Set(m.events.filter(e=>e.t==='red').map(e=>e.playerId));
  return Object.keys(m.squad).filter(id=>['starter','sub'].includes(m.squad[id].role)&&!on.has(id)&&!sentOff.has(id)&&!gone(m,id));
}
const byNum=ids=>ids.filter(id=>P(id)).sort((a,b)=>P(a).num-P(b).num);
function score(m){
  let us=0,them=0;
  for(const e of m.events){
    if(e.t==='goal'){if(e.how==='Own goal')them++;else us++}
    else if(e.t==='oppgoal')them++;

}
function describe(e,m){

  switch(e.t){
    case 'goal':

    case 'shot':return '🎯 Shot'+(e.detail?' ('+esc(e.detail.toLowerCase())+')':'')+' — '+L(e.playerId);
    case 'keypass':return '🔑 Key pass — '+L(e.playerId);

    case 'move':return '↔️ '+L(e.playerId)+' moves '+(e.how?esc(e.how)+' → ':'to ')+esc(e.detail||'?');
    case 'tstat':return '📊 '+esc(e.detail||'')+' — '+esc(e.how==='us'?S.team.name:(m&&m.opp)||'Opposition');
    case 'note':return '📝 '+esc(e.text||'');
    case 'period':return '⏱ '+esc(e.label);
  }
  return esc(e.t);
}
const sortedEvents=m=>m.events.map((e,i)=>({e,i})).sort((a,b)=>a.e.period-b.e.period||a.e.minute-b.e.minute||a.i-b.i).map(x=>x.e);

function matchEnd(m){
  const len=(m.clock&&m.clock.len)||(m.periods*m.periodMins)||90;
  let last=0;for(const e of m.events)if(e.t!=='note'&&e.t!=='period'&&e.minute>last)last=e.minute;
  return Math.max(len,last);
}
function minsPlayed(m,pid){
  const r=m.squad[pid];if(!r||(r.role!=='starter'&&r.role!=='sub'))return 0;
  const ev=sortedEvents(m);let on=r.role==='starter'?0:null,off=null;
  for(const e of ev){
    if(e.t==='sub'&&e.onId===pid&&on===null)on=e.minute;
    if(on!==null&&off===null&&((e.t==='sub'&&e.offId===pid)||(e.t==='red'&&e.playerId===pid)))off=e.minute;
  }
  if(on===null)return 0;
  return Math.max(0,(off===null?matchEnd(m):off)-on);
}
function stats(pid){
  const o={sel:0,played:0,started:0,mins:0,goals:0,assists:0,shots:0,key:0,saves:0,tackles:0,yc:0,rc:0};
  for(const m of S.matches){
    if(m.status!=='done'||!compOk(m))continue;
    const r=m.squad[pid];if(!r||(r.role!=='starter'&&r.role!=='sub'))continue;
    o.sel++;
    if(r.role==='starter')o.started++;
    if(r.role==='starter'||m.events.some(e=>e.t==='sub'&&e.onId===pid))o.played++;
    o.mins+=minsPlayed(m,pid);
    for(const e of m.events){
      if(e.t==='goal'&&e.playerId===pid&&e.how!=='Own goal')o.goals++;
      if(e.t==='goal'&&e.assistId===pid)o.assists++;
      if(e.t==='shot'&&e.playerId===pid)o.shots++;
      if(e.t==='keypass'&&e.playerId===pid)o.key++;
      if(e.t==='save'&&e.playerId===pid)o.saves++;
      if(e.t==='tackle'&&e.playerId===pid)o.tackles++;
      if(e.t==='yellow'&&e.playerId===pid)o.yc++;
      if(e.t==='red'&&e.playerId===pid)o.rc++;
    }
  }
  const f=feedMap()[pid];if(f)for(const k in f)o[k]+=f[k];
  o.apps=o.played;
  return o;
}
function attStats(pid){
  const o={marked:0,attended:0,late:0,early:0,absent:0,notified:0,noshow:0};
  for(const x of S.sessions){const a=x.records&&x.records[pid];if(!a)continue;
    o.marked++;
    if(a.attended){o.attended++;if(a.late)o.late++;if(a.leftEarly)o.early++}
    else{o.absent++;if(a.reason==='Notified in advance')o.notified++;if(a.reason==='No-show')o.noshow++}}
  o.pct=o.marked?Math.round(100*o.attended/o.marked):null;
  return o;
}

/* ---------- positions, formations, lineup ---------- */
// x = 0 (team's left) to 100 (team's right); y = 0 (opposition goal) to 100 (own goal)
const POSITIONS={GK:[50,91],RB:[85,75],RCB:[67,77],CB:[50,77],LCB:[33,77],LB:[15,75],RWB:[88,63],LWB:[12,63],RDM:[66,59],CDM:[50,59],LDM:[34,59],RM:[86,45],RCM:[66,45],CM:[50,45],LCM:[34,45],LM:[14,45],RAM:[67,32],CAM:[50,32],LAM:[33,32],RW:[86,24],LW:[14,24],RS:[64,15],CF:[50,15],LS:[36,15]};
const POS_ROWS=[['LW','LS','CF','RS','RW'],['LAM','CAM','RAM'],['LM','LCM','CM','RCM','RM'],['LWB','LDM','CDM','RDM','RWB'],['LB','LCB','CB','RCB','RB'],['GK']];
const GROUPXY={GK:[50,91],DEF:[50,76],MID:[50,45],FWD:[50,16]};
const LINE_SLOTS={
  DEF:{1:['CB'],2:['RCB','LCB'],3:['RCB','CB','LCB'],4:['RB','RCB','LCB','LB'],5:['RB','RCB','CB','LCB','LB']},
  DM:{1:['CDM'],2:['RDM','LDM'],3:['RDM','CDM','LDM']},
  MID:{1:['CM'],2:['RCM','LCM'],3:['RCM','CM','LCM'],4:['RM','RCM','LCM','LM'],5:['RM','RCM','CM','LCM','LM']},
  AM:{1:['CAM'],2:['RAM','LAM'],3:['RAM','CAM','LAM']},
  FWD:{1:['CF'],2:['RS','LS'],3:['RW','CF','LW']}
};
const FORMS={11:['4-4-2','4-3-3','4-2-3-1','3-5-2','3-4-3','5-4-1','4-1-4-1','4-4-1-1'],9:['3-3-2','3-2-3','2-4-2','3-4-1'],8:['3-3-1','2-3-2','3-2-2'],7:['2-3-1','3-2-1','2-2-2'],6:['2-2-1','2-1-2'],5:['2-1-1','1-2-1']};
function formSlots(f,n){
  const c=String(f||'').split('-').map(Number);
  if(!c.length||c.some(x=>!(x>0))||c.reduce((a,b)=>a+b,0)!==n-1)return null;
  let lines;
  if(c.length===3)lines=[['DEF',c[0]],['MID',c[1]],['FWD',c[2]]];
  else if(c.length===4){const[a,b,cc,d]=c;
    if(b>cc)lines=[['DEF',a],['MID',b],['AM',cc],['FWD',d]];
    else if(b<cc)lines=[['DEF',a],['DM',b],[cc<=3?'AM':'MID',cc],['FWD',d]];
    else lines=[['DEF',a],['DM',b],['AM',cc],['FWD',d]]}
  else if(c.length===2)lines=[['DEF',c[0]],['FWD',c[1]]];
  else return null;
  const out=['GK'];
  for(const[t,k]of lines){const s=LINE_SLOTS[t][k];if(!s)return null;out.push(...s)}
  return out;
}
function defaultForm(n){
  if(FORMS[n])return FORMS[n][0];
  const o=Math.max(1,n-1),d=Math.min(5,Math.max(1,Math.round(o*.4))),f=Math.min(3,Math.max(1,Math.round(o*.25))),mid=o-d-f;
  return mid>0&&mid<=5?d+'-'+mid+'-'+f:'';
}
const formsFor=n=>FORMS[n]||[defaultForm(n)].filter(Boolean);
const slotsFor=(f,n)=>formSlots(f,n)||formSlots(defaultForm(n),n)||['GK',...Object.keys(POSITIONS).filter(k=>k!=='GK').slice(0,Math.max(0,n-1))];
function nearestPos(x,y){let b=null;for(const k in POSITIONS){const d=Math.hypot(POSITIONS[k][0]-x,POSITIONS[k][1]-y);if(!b||d<b.d)b={k,d}}return b.k}
function pitchPt(cx,cy){
  const el=document.querySelector('.pitch');if(!el)return null;
  const r=el.getBoundingClientRect();if(!r.width||!r.height)return null;
  return{x:Math.max(0,Math.min(100,(cx-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(cy-r.top)/r.height*100))};
}

/* put players into slots: keep a preferred position when free, otherwise the nearest free slot */
function placePlayers(ids,slots,pref){
  const out={};const free=[...slots];let left=[...ids];
  for(const id of [...left]){const p=pref[id];if(p&&free.includes(p)){out[id]=p;free.splice(free.indexOf(p),1);left=left.filter(x=>x!==id)}}
  const xy=id=>{const p=pref[id];if(p&&POSITIONS[p])return POSITIONS[p];const g=P(id)&&P(id).pos;return GROUPXY[g]||[50,50]};
  const isGk=id=>pref[id]==='GK'||(!pref[id]&&P(id)&&P(id).pos==='GK');
  while(left.length&&free.length){
    let best=null;
    for(const id of left)for(const s of free){
      const a=xy(id);let d=Math.hypot(a[0]-POSITIONS[s][0],a[1]-POSITIONS[s][1]);
      if((s==='GK')!==isGk(id))d+=500;
      if(!best||d<best.d)best={id,s,d};
    }
    out[best.id]=best.s;left=left.filter(x=>x!==best.id);free.splice(free.indexOf(best.s),1);
  }
  return out;
}
/* starting positions for a match (stored ones, gaps filled automatically) */
function startPos(m){
  const ids=Object.keys(m.squad).filter(id=>m.squad[id].role==='starter'&&P(id));
  const pos={};ids.forEach(id=>{if(m.squad[id].pos&&POSITIONS[m.squad[id].pos])pos[id]=m.squad[id].pos});
  const miss=ids.filter(id=>!pos[id]);
  if(miss.length){
    const taken=new Set(Object.values(pos));
    let slots=slotsFor(m.formation,m.onPitch).filter(s=>!taken.has(s));
    if(slots.length<miss.length)slots=Object.keys(POSITIONS).filter(s=>!taken.has(s));
    Object.assign(pos,placePlayers(miss,slots,{}));
  }
  return pos;
}
/* where everyone is right now: start positions, then subs and moves in order */
function posMap(m){
  const pos=Object.assign({},startPos(m));
  for(const e of sortedEvents(m)){
    if(e.t==='sub'){const p=pos[e.offId];delete pos[e.offId];if(p)pos[e.onId]=p}
    else if(e.t==='move'&&e.playerId&&e.detail)pos[e.playerId]=e.detail;
    else if(e.t==='red'&&e.playerId)delete pos[e.playerId];
  }
  const miss=[...pitchSet(m)].filter(id=>P(id)&&!pos[id]);
  if(miss.length){
    const taken=new Set(Object.values(pos));
    let slots=slotsFor(m.formation,m.onPitch).filter(s=>!taken.has(s));
    if(slots.length<miss.length)slots=Object.keys(POSITIONS).filter(s=>!taken.has(s));
    Object.assign(pos,placePlayers(miss,slots,{}));
  }
  return pos;
}
function movePos(m,pid,to){
  if(!to||!P(pid))return;
  if(m.clock.state==='ready'){
    const cur=startPos(m);const from=cur[pid];if(!m.squad[pid]||m.squad[pid].role!=='starter'||from===to)return;
    const occ=Object.keys(cur).find(id=>id!==pid&&cur[id]===to);
    m.squad[pid].pos=to;if(occ)m.squad[occ].pos=from;
    save();render();return;
  }
  const pos=posMap(m);const from=pos[pid];if(from===to)return;
  const occ=Object.keys(pos).find(id=>id!==pid&&pos[id]===to);
  const st=curStamp(m);const ids=[];
  const mk=(id,a,b)=>{const e={id:uid(),t:'move',playerId:id,how:a||'',detail:b,period:st.period,minute:st.minute,ts:Date.now()};m.events.push(e);ids.push(e.id)};
  mk(pid,from,to);if(occ)mk(occ,to,from);
  save();buzz();V.sheet=null;render();
  toast(sname(P(pid))+' '+(from||'?')+' → '+to+(occ?' (swapped with '+sname(P(occ))+')':''),{label:'Undo',fn:()=>{m.events=m.events.filter(e=>!ids.includes(e.id));save();render()}},4500);
}

/* ---------- who can play, and the prefill options ---------- */
const fmtD=d=>{try{return new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
function availOn(p,date){
  if(p.left&&!(p.end&&date&&p.end>date))return false;
  if(p.start&&date&&p.start>date)return false;
  if(p.end&&date&&p.end<date)return false;
  return true;
}
const poolFor=m=>S.players.filter(p=>availOn(p,m.date)).sort((a,b)=>a.num-b.num);
function prevMatch(m){
  return S.matches.filter(x=>x.id!==m.id&&x.status==='done').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0))[0]||null;
}
function prefillLineup(m,mode){
  const prev=prevMatch(m),n=m.onPitch;
  const fit=poolFor(m).filter(p=>!p.injured);
  const mins={};if(prev)fit.forEach(p=>{mins[p.id]=minsPlayed(prev,p.id)});
  const pStart=prev?startPos(prev):{},pEnd=prev?posMap(prev):{};
  const lastP=id=>pStart[id]||pEnd[id]||null;
  const form=prev&&prev.formation&&formSlots(prev.formation,n)?prev.formation:defaultForm(n);
  const slots=slotsFor(form,n);
  const fitIds=new Set(fit.map(p=>p.id));
  const chosen={};
  const xyOf=id=>{const l=lastP(id);if(l&&POSITIONS[l])return POSITIONS[l];return GROUPXY[P(id).pos]||[50,50]};
  const repl=slot=>{
    let best=null;
    for(const p of fit){if(p.id in chosen)continue;
      const a=xyOf(p.id);let d=Math.hypot(a[0]-POSITIONS[slot][0],a[1]-POSITIONS[slot][1])+(mins[p.id]||0)*.05;
      const isGk=lastP(p.id)==='GK'||(!lastP(p.id)&&p.pos==='GK');
      if((slot==='GK')!==isGk)d+=500;
      if(!best||d<best.d)best={id:p.id,d};
    }
    return best&&best.id;
  };
  if(mode==='rest'||!prev){
    let gk=null;
    const gks=fit.filter(p=>lastP(p.id)==='GK'||(!lastP(p.id)&&p.pos==='GK')).sort((a,b)=>(mins[a.id]||0)-(mins[b.id]||0)||a.num-b.num);
    const startedGk=gks.find(p=>pStart[p.id]==='GK');
    gk=startedGk||gks[0]||null;
    const rest=fit.filter(p=>!gk||p.id!==gk.id).sort((a,b)=>(mins[a.id]||0)-(mins[b.id]||0)||a.num-b.num);
    const ids=[...(gk?[gk.id]:[]),...rest.map(p=>p.id)].slice(0,n);
    const pref={};ids.forEach(id=>{const l=lastP(id);if(l)pref[id]=l});if(gk)pref[gk.id]='GK';
    Object.assign(chosen,placePlayers(ids,slots,pref));
  }else{
    const base=mode==='finish'
      ?Object.keys(pEnd).filter(id=>pitchSet(prev).has(id)).map(id=>[id,pEnd[id]])
      :Object.keys(prev.squad).filter(id=>prev.squad[id].role==='starter').map(id=>[id,pStart[id]]);
    const missing=[];
    base.forEach(([id,pos])=>{if(fitIds.has(id)&&Object.keys(chosen).length<n)chosen[id]=pos;else missing.push(pos)});
    missing.forEach(pos=>{if(Object.keys(chosen).length>=n)return;const r=repl(pos);if(r)chosen[r]=pos});
    // top up if fewer than a full side (e.g. someone was sent off last game)
    const taken=new Set(Object.values(chosen));
    for(const s of slots){if(Object.keys(chosen).length>=n)break;if(taken.has(s))continue;const r=repl(s);if(r){chosen[r]=s;taken.add(s)}}
  }
  const sq={};
  const benchN=Math.max(3,Math.ceil(n*0.65));
  const benchIdsPick=new Set(fit.filter(p=>!chosen[p.id]).sort((a,b)=>(mins[a.id]||0)-(mins[b.id]||0)||a.num-b.num).slice(0,benchN).map(p=>p.id));
  poolFor(m).forEach(p=>{
    if(chosen[p.id])sq[p.id]={role:'starter',reason:'',pos:chosen[p.id]};
    else if(p.injured)sq[p.id]={role:'out',reason:'Injured'};
    else if(benchIdsPick.has(p.id))sq[p.id]={role:'sub',reason:''};
    else sq[p.id]={role:'out',reason:'Not selected'};
  });
  m.squad=sq;m.formation=form;V.prefill=prev?mode:'rest';V.lsel=null;
}

/* ---------- pitch drawing ---------- */
const PITCH_SVG=`<svg class="pl" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".6" vector-effect="non-scaling-stroke"><rect x="2" y="2" width="96" height="96"/><line x1="2" y1="50" x2="98" y2="50"/><circle cx="50" cy="50" r="10"/><rect x="25" y="2" width="50" height="16"/><rect x="38" y="2" width="24" height="6"/><rect x="25" y="82" width="50" height="16"/><rect x="38" y="92" width="24" height="6"/></svg>`;
const ZONES=Object.keys(POSITIONS).map(k=>`<div class="zn" data-z="${k}" style="left:${POSITIONS[k][0]}%;top:${POSITIONS[k][1]}%">${k}</div>`).join('');
function pitchEl(inner,o){
  o=o||{};
  return `<div class="pitch abs ${o.cls||''}" ${o.drop?`data-drop="${o.drop}"`:''} ${o.act?`data-act="${o.act}"`:''}>${PITCH_SVG}${ZONES}${inner}</div>`;
}
function tokenHtml(id,o){
  const p=P(id);if(!p)return '';
  const xy=o.pos&&POSITIONS[o.pos];
  const st=xy?` style="left:${xy[0]}%;top:${xy[1]}%"`:'';
  const base=o.drag
    ?`data-drag="1" data-id="${id}" data-where="${o.where}" ${o.drop?'data-drop="tok"':''} ${o.act?`data-act="${o.act}"`:''}`
    :`data-act="${o.act}" data-id="${id}"`;

}
function matchBadges(m){
  const goals={},yel={};

}
const gmMap=m=>{const o={};try{liveRows(m).forEach(r=>{o[r.id]=r.now})}catch(e){}return o};

function lineupDrop(src,target,tid,pt){
  const m=M();const sq=m.squad;
  const role=id=>sq[id]?sq[id].role:'';
  const nStart=()=>Object.values(sq).filter(x=>x.role==='starter').length;
  if(target==='lu-bench'){sq[src]={role:'sub',reason:''}}
  else if(target==='lu-out'){sq[src]={role:'out',reason:P(src)&&P(src).injured?'Injured':(sq[src]&&sq[src].reason)||'Not selected'}}
  else if(target==='tok'||target==='lu-pitch'){
    const cur=startPos(m);
    const to=target==='tok'&&tid?cur[tid]:(pt?nearestPos(pt.x,pt.y):null);
    if(!to)return;
    const occ=Object.keys(cur).find(id=>id!==src&&cur[id]===to);
    if(role(src)==='starter'){
      const from=cur[src];if(occ)sq[occ].pos=from;sq[src].pos=to;
    }else{
      if(occ)sq[occ]={role:'sub',reason:''};
      else if(nStart()>=m.onPitch){toast('The pitch is full. Move someone to the subs first.');return}
      sq[src]={role:'starter',reason:'',pos:to};
    }
  }else return;
  V.lsel=null;V.prefill='';save();render();
}

const PW=68,PH=52.5;
const ZCELLS=(()=>{const o=[['Wide left',0,13.85,0,16.5],['Wide right',54.15,68,0,16.5]];
  [['close',0,5.5],['mid',5.5,11],['far',11,16.5]].forEach(([rn,y0,y1])=>[['left',13.85,27.3],['centre',27.3,40.7],['right',40.7,54.15]].forEach(([cn,x0,x1])=>o.push(['Box '+rn+' '+cn,x0,x1,y0,y1])));
  [['far left',0,13.85],['left',13.85,27.3],['centre',27.3,40.7],['right',40.7,54.15],['far right',54.15,68]].forEach(([cn,x0,x1])=>o.push(['Edge '+cn,x0,x1,16.5,26]));
  [['left',0,22.67],['centre',22.67,45.33],['right',45.33,68]].forEach(([cn,x0,x1])=>o.push(['Long range '+cn,x0,x1,26,52.5]));
  return o})();
const zoneOf=(x,y)=>{if(y>PH)return{name:'Own half'};for(const [n,x0,x1,y0,y1] of ZCELLS)if(x>=x0&&x<=x1&&y>=y0&&y<=y1)return{name:n};return{name:''}};

function shotGeo(x,y){if(y>PH)return null;const d=Math.hypot(x-34,y);let a=Math.atan2(7.32*y,(x-34)*(x-34)+y*y-3.66*3.66)*180/Math.PI;if(a<0)a+=180;return{d,a}}
const pinM=()=>V.sheet&&V.sheet.d&&V.sheet.d.fromLog?logMatch():M();
const pinEv=(m,id)=>m&&m.events.find(e=>e.id===id);

/* ---------- balance time: who should go off and on so outfield players finish level ---------- */
const LINE_OF=l=>/^(RB|RCB|CB|LCB|LB|RWB|LWB|DEF)$/.test(l||'')?'DEF':/^(RDM|CDM|LDM|RM|RCM|CM|LCM|LM|RAM|CAM|LAM|MID)$/.test(l||'')?'MID':/^(RW|LW|RS|CF|LS|FWD)$/.test(l||'')?'FWD':'';
function balancePlan(m){
  const end=matchEnd(m),cm=nowMin(m),R=Math.max(0,end-cm);
  const on=pitchSet(m),pos=posMap(m),hurt=hurtSet(m);
  const sentOff=new Set(m.events.filter(e=>e.t==='red').map(e=>e.playerId));
  const isGK=id=>pos[id]==='GK'||(P(id)&&P(id).pos==='GK');
  const ids=Object.keys(m.squad).filter(id=>P(id)&&!gone(m,id)&&['starter','sub'].includes(m.squad[id].role)&&!sentOff.has(id)&&!isGK(id)&&(on.has(id)||(!P(id).injured&&!hurt.has(id))));
  const now={};ids.forEach(id=>{const sp=playSpan(m,id)||{on:null,off:null};now[id]=sp.on===null?0:Math.max(0,(sp.off===null?cm:sp.off)-sp.on)});
  const line=id=>LINE_OF(on.has(id)?pos[id]:'')||LINE_OF(P(id).pos)||LINE_OF(pos[id]);
  const pitch=ids.filter(id=>on.has(id)),bench=ids.filter(id=>!on.has(id));
  // one change per fit bench player at most; most-rested bench player replaces the player with most minutes, same line where possible
  const taken=new Set(),subs=[];
  bench.slice().sort((x,y)=>now[x]-now[y]).forEach(j=>{
    const free=pitch.filter(i=>!taken.has(i)&&now[i]>now[j]+4);
    const same=free.filter(i=>!line(j)||line(i)===line(j));
    const pick=(same.length?same:free).sort((x,y)=>now[y]-now[x])[0];
    if(!pick)return;
    taken.add(pick);
    // change time so both finish on about the same minutes
    let t=Math.round((end+cm+now[j]-now[pick])/2);t=Math.max(cm,Math.min(end-1,t));
    subs.push({min:t,off:pick,on:j,offPos:pos[pick]||'',line:line(pick),lineOn:line(j),mismatch:!!(line(j)&&line(pick)&&line(j)!==line(pick))});
  });
  subs.sort((x,y)=>x.min-y.min);
  const fin={};ids.forEach(id=>fin[id]=now[id]+R);
  subs.forEach(s=>{fin[s.off]=now[s.off]+(s.min-cm);fin[s.on]=now[s.on]+(end-s.min)});
  const rows=ids.map(id=>({id,now:now[id],more:fin[id]-now[id],fin:fin[id],on:on.has(id),line:line(id)})).sort((a,b)=>(b.on-a.on)||P(a.id).num-P(b.id).num);
  const f=rows.map(r=>r.fin);
  return{end,cm,R,rows,subs,n:ids.length,slots:pitch.length,spare:bench.length-subs.length,benchN:bench.length,lo:f.length?Math.min(...f):0,hi:f.length?Math.max(...f):0};
}

const compRank=c=>{const x=String(c).toLowerCase();

  if(/league cup|efl cup|carabao|challenge cup/.test(x))return 3;

const compNorm=c=>{const n=String(c||'').split(' - ')[0].replace(/\s*\(.*\)\s*$/,'').replace(/^UEFA\s+/i,'').trim();return n==='League Cup'?'Scottish League Cup':n};
const proComps=()=>{try{return(CLOUD&&S.team&&S.team.proTeam)?PRO.matches.filter(m=>m.status==='finished'&&m.comp&&!proRecorded(m)).map(m=>compNorm(m.comp)):[]}catch(e){return []}};

/* form: oldest on the left, newest on the right, as many as fit on one line */
function formItems(ms){
  const t=S.team,pro=typeof CLOUD!=='undefined'&&CLOUD&&t&&t.proTeam&&typeof PRO!=='undefined'&&true;
  const sameOpp=(pm,x)=>pm.match_date===x.date&&[pm.home,pm.away].some(n=>{const a=clubKey(n),c=clubKey(x.opp);return a&&c&&(a.includes(c)||c.includes(a))});
  const fin=pro?PRO.matches.filter(m=>m.status==='finished'&&m.home_goals!=null&&(!V.comp||compNorm(m.comp)===V.comp)):[];
  const it=[];
  ms.forEach(m=>{if(!fin.some(pm=>sameOpp(pm,m))){const x=score(m);it.push({d:m.date||'',t:m.time||'',us:x.us,them:x.them,opp:m.opp||''})}});
  if(pro){
    const ck=clubKey(t.proClub);

      const home=clubKey(m.home)===ck||(ck&&clubKey(m.home).includes(ck));
      it.push({d:m.match_date,t:String(m.kickoff||'').slice(0,5),us:home?m.home_goals:m.away_goals,them:home?m.away_goals:m.home_goals,opp:home?m.away:m.home,res:proResult(m,home?'home':'away').res})});

/* ---------- in-game player table ---------- */
function playSpan(m,pid){
  const r=m.squad[pid];if(!r||(r.role!=='starter'&&r.role!=='sub'))return null;
  let on=r.role==='starter'?0:null,off=null;
  for(const e of sortedEvents(m)){
    if(e.t==='sub'&&e.onId===pid&&on===null)on=e.minute;
    if(on!==null&&off===null&&((e.t==='sub'&&e.offId===pid)||(e.t==='red'&&e.playerId===pid)))off=e.minute;
  }
  return{on,off};
}
function nowMin(m){const c=m.clock;if(c.state==='ready')return 0;return Math.min(matchEnd(m),(c.period-1)*m.periodMins+Math.floor(elapsedMs(m)/60000))}
function liveRows(m){
  const cm=nowMin(m),end=matchEnd(m),on=pitchSet(m);
  const sentOff=new Set(m.events.filter(e=>e.t==='red').map(e=>e.playerId));
  const rows=[];
  for(const id of Object.keys(m.squad)){
    const r=m.squad[id];if(!P(id)||gone(m,id)||(r.role!=='starter'&&r.role!=='sub'))continue;
    const sp=playSpan(m,id)||{on:null,off:null};
    const now=sp.on===null?0:Math.max(0,(sp.off===null?cm:sp.off)-sp.on);
    const fc=sp.on===null?0:Math.max(0,(sp.off===null?end:sp.off)-sp.on);
    let pos=0,neg=0;
    for(const e of m.events){
      if(e.t==='goal'){if(e.playerId===id){if(e.how==='Own goal')neg++;else pos++}if(e.assistId===id)pos++}
      else if(e.playerId===id){if(['shot','keypass','save','tackle'].includes(e.t))pos++;else if(['yellow','red','mistake'].includes(e.t))neg++}
    }
    const st=on.has(id)?'On':sentOff.has(id)?'Sent off':sp.on===null?'Bench':'Off';
    rows.push({id,started:r.role==='starter',st,now,fc,pos,neg,ord:{On:0,Bench:1,Off:2,'Sent off':3}[st]});
  }
  return rows.sort((a,b)=>a.ord-b.ord||P(a.id).num-P(b.id).num);
}
function liveTable(m){
  const rows=liveRows(m);if(!rows.length)return '';
  return `<div class="tblwrap"><table class="lt"><thead><tr><th class="nm">Player</th><th title="Started the match">Start</th><th>Now</th><th title="Minutes played so far">Mins</th><th title="Minutes by full time if nothing changes">To end</th><th title="Positive actions: goals, assists, shots, key passes, saves, key tackles">＋</th><th title="Negative actions: mistakes, cards, own goals">－</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.st==='On'?'':'dim'}"><td class="nm"><b>${esc(P(r.id).num)}</b> ${esc(sname(P(r.id)))}</td><td>${r.started?'✓':'–'}</td><td><span class="stt ${r.st==='On'?'on':''}">${r.st}</span></td><td>${r.now}'</td><td>${r.fc}'</td><td class="pos">${r.pos||'·'}</td><td class="neg">${r.neg||'·'}</td></tr>`).join('')}</tbody></table></div>`;
}

  return header('Results',fi.length?`P${fi.length} · W${w} D${d} L${l}`:'')+`<main>${proUpcoming()}${formStrip(ms)}${compBar()}${seasonCard(ms)}${rows.length?`<div class="cols">${rows.map(r=>r.h).join('')}</div>`:(t&&t.proTeam?'':'<div class="empty"><b>No finished matches yet</b>Record your first match and it will appear here.</div>')}</main>`;
}

/* ---------- roster parsing / OCR ---------- */
function parseRoster(text,existing){
  const rows=[];
  for(let line of String(text||'').split(/\r?\n/)){
    line=line.replace(/["|•·_]+/g,' ').replace(/\t+/g,' ').replace(/\s+/g,' ').trim();
    if(/^(no\.?|number|num|#|shirt)?\s*[,;:]?\s*(name|player|players)\b/i.test(line))continue;
    if(!line)continue;
    let num=null,name=line,m;
    if((m=line.match(/^#?\s*(\d{1,2})(?:\s*[.):\-–—,;]\s*|\s+)(.+)$/))){num=+m[1];name=m[2]}
    else if((m=line.match(/^(.+?)[\s,;\-–—:.]+#?(\d{1,2})$/))){name=m[1];num=+m[2]}
    name=name.replace(/[^A-Za-zÀ-ÿ'’\-. ]/g,'').replace(/\s+/g,' ').trim();
    if(name.length<2)continue;
    rows.push({num,name});
  }
  const used=new Set(existing.map(String));rows.forEach(r=>{if(r.num!=null)used.add(String(r.num))});
  let n=1;rows.forEach(r=>{if(r.num==null){while(used.has(String(n)))n++;r.num=n;used.add(String(n))}});
  return rows;
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function runOCR(file){
  const I=V.imp;I.err='';I.busy='Loading the reader…';renderSheet();
  try{
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    I.busy='Reading the photo…';renderSheet();
    const res=await window.Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text'){I.busy='Reading the photo… '+Math.round(m.progress*100)+'%';const n=document.querySelector('.ocrbox .note');if(n)n.textContent=I.busy}}});
    I.text=(res.data&&res.data.text)||'';I.busy='';
    I.rows=parseRoster(I.text,activePlayers().map(p=>p.num));
    if(!I.rows.length){I.rows=null;I.err="Couldn't find any names in that photo. Try a clearer shot, or type the list."}
  }catch(e){I.busy='';I.err="Couldn't read the photo — the reader needs a data connection the first time. You can paste or type the list instead."}
  if(V.sheet&&V.sheet.kind==='import')renderSheet();
}

async function importFile(f){
  const I=V.imp;I.err='';
  if(/^image\//.test(f.type)||/\.(png|jpe?g|heic|webp)$/i.test(f.name)){
    if(!OCR){I.err='Reading photos is only in the installed app. Type or paste the list instead.';renderSheet();return}
    return runOCR(f)}
  if(/\.(csv|tsv|txt)$/i.test(f.name)||/^text\//.test(f.type)){
    try{I.text=await f.text();I.rows=parseRoster(I.text,activePlayers().map(p=>p.num));
      if(!I.rows.length){I.rows=null;I.err="Couldn't find any players in that file. It should have one player per line, number and name."}}
    catch(e){I.err="Couldn't open that file."}
  }else I.err='That file type is not supported yet. Use CSV, text or a photo.';
  if(V.sheet&&V.sheet.kind==='import')renderSheet();
}

function logPeriod(m,labelTxt){const st=curStamp(m);m.events.push({id:uid(),t:'period',label:labelTxt,period:st.period,minute:st.minute,ts:Date.now()})}
function freeze(m){const c=m.clock;if(c.state==='running'){c.accMs+=Date.now()-c.startedAt;c.startedAt=null;c.state='paused'}}
/* old matches logged half time and full time with a runaway minute (clock was stopped but still marked running). Put them back. */
function repairMatches(){
  let n=0;
  for(const m of (S.matches||[])){
    if(!m.events||!m.periods||!m.periodMins)continue;
    const cap=m.periods*m.periodMins+60;
    const bad=m.events.filter(e=>e.t==='period'&&e.minute>cap);if(!bad.length)continue;
    const real=m.events.filter(e=>e.t!=='period'&&e.t!=='note'&&e.minute<=cap);
    const lastIn=pr=>real.filter(e=>e.period===pr).reduce((a,e)=>Math.max(a,e.minute),0);
    for(const e of bad){
      const full=/full time|ended early/i.test(e.label||'');
      const end=e.period*m.periodMins;
      e.minute=full?Math.max(end,lastIn(e.period)):end;n++;
    }
  }
  if(n){try{save()}catch(x){}}
}

  delSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);V.sess=null;save();V.sheet=null;render()},

function matchSummary(m){
  const sc=score(m),ev=sortedEvents(m),live=m.status!=='done';
  const nm=id=>{const p=P(id);return p?p.name:'a player'};
  const res=sc.us>sc.them?'won':sc.us<sc.them?'lost':'drew';
  const where=m.venue==='home'?'at home to':m.venue==='away'?'away to':'against';
  const when=m.date?' on '+(()=>{try{return new Date(m.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long'})}catch(e){return m.date}})():'';
  const out=[];
  const state=sc.us>sc.them?'leading':sc.us<sc.them?'trailing':'level at';
  out.push(live?`${S.team.name} are ${state} ${sc.us}–${sc.them} ${where} ${m.opp}${m.comp?' in the '+m.comp:''}.`
    :`${S.team.name} ${res} ${sc.us}–${sc.them} ${where} ${m.opp}${m.comp?' in the '+m.comp:''}${when}.`);
  const first=ev.filter(e=>e.period===1);
  if(!live&&m.periods>=2&&ev.some(e=>e.t==='goal'||e.t==='oppgoal')){
    const h=score({events:first});out.push(`It was ${h.us}–${h.them} at half-time.`)}
  const gl=ev.filter(e=>e.t==='goal'&&e.how!=='Own goal');
  if(gl.length){
    const g={};gl.forEach(e=>{const k=e.how==='Opp own goal'?'opposition own goal':nm(e.playerId);(g[k]=g[k]||[]).push(fmtMin(e,m)+(e.how==='Penalty'?' (pen)':''))});
    out.push('Scorers: '+Object.keys(g).map(k=>k+' '+g[k].join(', ')).join('; ')+'.');
    const as=gl.filter(e=>e.assistId).map(e=>nm(e.assistId));
    if(as.length)out.push('Assists: '+as.join(', ')+'.')}
  const ag=ev.filter(e=>e.t==='oppgoal'||(e.t==='goal'&&e.how==='Own goal'));
  if(ag.length)out.push('Conceded: '+ag.map(e=>(e.t==='goal'?'own goal by '+nm(e.playerId):(e.oppName||'opposition'))+' '+fmtMin(e,m)+(e.how==='Penalty'?' (pen)':'')).join(', ')+'.');
  if(!gl.length&&!ag.length&&!live)out.push('A goalless draw.');
  const yc=ev.filter(e=>e.t==='yellow').length,rc=ev.filter(e=>e.t==='red');
  if(yc||rc.length)out.push('Discipline: '+[yc?yc+' yellow'+(yc>1?'s':''):'',rc.length?rc.length+' red ('+rc.map(e=>nm(e.playerId)).join(', ')+')':''].filter(Boolean).join(', ')+'.');
  const sb=ev.filter(e=>e.t==='sub').length;
  if(sb)out.push(sb+' substitution'+(sb>1?'s':'')+' made.');
  return out.join(' ');
}
function shareText(m){
  const sc=score(m);const ev=sortedEvents(m);
  const head=`FT ⚽ ${S.team.name} ${sc.us}–${sc.them} ${m.opp}`;
  const meta=[m.comp,m.venue==='home'?'Home':m.venue==='away'?'Away':'Neutral',dateStr(m)].filter(Boolean).join(' · ');
  const gl=ev.filter(e=>e.t==='goal'&&e.how!=='Own goal').map(e=>{
    const who=e.how==='Opp own goal'?'Opposition own goal':(P(e.playerId)?P(e.playerId).name:'');
    return `${fmtMin(e,m)} ${who}${e.assistId&&P(e.assistId)?` (assist ${P(e.assistId).name})`:''}`});
  const og=ev.filter(e=>e.t==='goal'&&e.how==='Own goal').length;
  const ag=ev.filter(e=>e.t==='oppgoal').map(e=>`${fmtMin(e,m)} ${[e.oppNum?'#'+e.oppNum:'',e.oppName||''].filter(Boolean).join(' ')||'Opposition'}`);
  const cards=ev.filter(e=>e.t==='yellow'||e.t==='red').map(e=>`${e.t==='yellow'?'🟨':'🟥'} ${P(e.playerId)?P(e.playerId).name:''}`);
  return [head,meta,'',matchSummary(m),'',gl.length?'Goals:\n'+gl.join('\n'):'',ag.length||og?'Against:\n'+ag.join('\n')+(og?'\n(plus '+og+' own goal'+(og>1?'s':'')+')':''):'',cards.length?cards.join('\n'):'',m.notes?'\n'+m.notes:''].filter(x=>x!=='').join('\n');
}

    case 'playerRemove':ask({title:V.sheet.d.name+' has left the squad?',msg:'Their number becomes free for someone else. Their past match records stay, and you can bring them back from Former players.',ok:'Yes, they left',danger:true,fn:'playerRemove',arg:V.sheet.d.id});return;

    case 'cancelMatch':ask({title:'Cancel this match?',msg:'Nothing has been recorded yet, so it will just be discarded.',ok:'Discard',cancel:'Keep it',danger:true,fn:'cancelMatch'});return;
    case 'role':{
      const cur=m.squad[ds.id];
      if(cur&&cur.role===ds.role)delete m.squad[ds.id];
      else m.squad[ds.id]={role:ds.role,reason:ds.role==='out'?(cur&&cur.reason)||'':''};
      V.err='';save();break}
    case 'reason':{const r=m.squad[ds.id];r.reason=r.reason===ds.val?'':ds.val;save();break}
    case 'restSub':poolFor(m).forEach(p=>{if(!m.squad[p.id])m.squad[p.id]={role:'sub',reason:''}});save();break;
    case 'toLive':{
      const st=Object.values(m.squad).filter(r=>r.role==='starter').length;
      if(!st){V.err='Pick at least one starter.';break}
      const sp=startPos(m);Object.keys(sp).forEach(id=>{m.squad[id].pos=sp[id]});
      {const ok=new Set(poolFor(m).map(p=>p.id));Object.keys(m.squad).forEach(id=>{if(!ok.has(id))delete m.squad[id]})}
      poolFor(m).forEach(p=>{const why=p.injured?'Injured':'Unknown';if(!m.squad[p.id])m.squad[p.id]={role:'out',reason:why};else if(m.squad[p.id].role==='out'&&!m.squad[p.id].reason)m.squad[p.id].reason=why});
      m.status='live';V.err='';V.lsel=null;save();break}
    case 'editLineup':m.status='setup';V.step='lineup';save();break;

    /* clock */
    case 'ko':{const c=m.clock;c.state='running';c.startedAt=Date.now();c.accMs=0;logPeriod(m,m.periods===2?'Kick-off':pname(m,c.period)+' start');save();lockScreen();break}
    case 'pause':freeze(m);m.clock.state='paused';save();break;

    case 'endPeriod':ask({title:'End '+pname(m,m.clock.period)+'?',msg:m.clock.period<m.periods?'The clock stops until you start the next period.':'This is the last period — the match goes to full time.',ok:'End it',fn:'endPeriod'});return;
    case 'nextPeriod':{const c=m.clock;c.state='running';c.startedAt=Date.now();c.accMs=0;logPeriod(m,pname(m,c.period)+' start');save();break}
    case 'finishEarly':ask({title:'End match early?',msg:'Use this if the game is abandoned or stopped. The score so far stands.',ok:'End match',danger:true,fn:'finishEarly'});return;

const nextNum=()=>{const u=new Set(activePlayers().map(p=>p.num));let n=1;while(u.has(n))n++;return n};

function pick(val){
  const s=V.sheet,d=s.d,k=s.kind,m=M();
  switch(k){
    case 'goal':
      if(s.step===0){
        if(val==='OPPOG')return addEvent(m,{t:'goal',playerId:null,how:'Opp own goal'});
        d.pid=val;s.step=1;
      }else if(s.step===1){
        d.how=val;
        if(val==='Penalty'||val==='Own goal')return addEvent(m,{t:'goal',playerId:d.pid,how:val});
        s.step=2;
      }else return addEvent(m,{t:'goal',playerId:d.pid,how:d.how,assistId:val||null});
      break;
    case 'shot':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'shot',playerId:d.pid,detail:val});break;
    case 'keypass':return addEvent(m,{t:'keypass',playerId:val});
    case 'save':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'save',playerId:d.pid,detail:val});break;
    case 'tackle':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'tackle',playerId:d.pid,detail:val});break;
    case 'mistake':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'mistake',playerId:d.pid,detail:val});break;
    case 'move':
      if(s.step===0){d.pid=val;s.step=1}else{movePos(m,d.pid,val);return}
      break;
    case 'yellow':return addEvent(m,{t:'yellow',playerId:val});
    case 'red':return addEvent(m,{t:'red',playerId:val});
    case 'sub':
      if(s.step===0){d.off=val;s.step=d.on?2:1}
      else if(s.step===1){d.on=val;s.step=2}
      else return addEvent(m,{t:'sub',offId:d.off,onId:d.on,reason:val});
      break;
  }
  renderSheet();
}

let toastT=null,TOAST_FN=null;

  TOAST_FN=actn?actn.fn:null;t.innerHTML=esc(msg)+(actn?`<button data-act="toastAct">${esc(actn.label)}</button>`:'');t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';TOAST_FN=null},ms||2200)}

/* ---------- binding ---------- */
function root(name){
  if(name==='team')return T();
  if(name==='m')return VM();
  if(name==='sheet')return V.sheet&&V.sheet.d;
  if(name==='imp')return V.imp;
  if(name==='auth')return V.auth;
  return null;
}
function setPath(path,val){
  const parts=path.split('.');const r=root(parts[0]);if(!r)return false;
  let o=r;for(let i=1;i<parts.length-1;i++)o=o[parts[i]];
  o[parts[parts.length-1]]=val;return true;
}
document.addEventListener('input',e=>{

  let path=el.dataset.bind;
  if(!path&&el.dataset.sbind){path=el.dataset.sbind.startsWith('imp.')?el.dataset.sbind:'sheet.'+el.dataset.sbind}
  if(!path)return;
  let v=el.value;
  if(el.dataset.num==='1')v=v===''?'':+v;

const sigOf=o=>JSON.stringify(o);
function pendingCount(){
  let n=0;

    const R=rowsFor(TD),sg=DB.sigs[id]||{};
    for(const tb of TABLES){const old=sg[tb]||{};

      for(const k in old)if(!(k in R[tb]))n++}}

}
async function pushTeam(TD){
  const tid=TD.team.id,R=rowsFor(TD),sg=(DB.sigs[tid]=DB.sigs[tid]||{});let n=0;
  for(const tb of TABLES){

    const up=[];for(const k in cur){const sig=sigOf(cur[k]);if(old[k]!==sig)up.push([k,sig,cur[k]])}
    for(let i=0;i<up.length;i+=100){
      const part=up.slice(i,i+100);
      const groups={};part.forEach(x=>{(groups[Object.keys(x[2]).join(',')]=groups[Object.keys(x[2]).join(',')]||[]).push(x)}); // rows with different columns go in separate requests
      for(const g of Object.values(groups)){

          for(const x of g){const {id:_i,...body}=x[2];await rest('PATCH','/teams?id=eq.'+encodeURIComponent(x[0]),body,'return=minimal')}
        }else await rest('POST','/'+tb+'?on_conflict='+PK[tb].join(','),g.map(x=>x[2]),'resolution=merge-duplicates,return=minimal');
      }

    for(;;){
      const rows=await rest('GET',`/${tb}?${tb==='teams'?'id':'team_id'}=eq.${encodeURIComponent(tid)}&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=1000`);
      if(!rows||!rows.length)break;
      if(applyRows(tb,rows,TD))changed=true;
      const last=Date.parse(rows[rows.length-1].updated_at);
      since=new Date(last-3000).toISOString();cu[tb]=since;
      if(rows.length<1000)break;
    }
  }
  return changed;
}
function removeTeamLocal(id){
  delete DB.teams[id];delete DB.sigs[id];delete DB.cursors[id];DB.view=(DB.view||[]).filter(x=>x!==id);
  if(DB.cur===id){DB.cur=Object.keys(DB.teams)[0]||null;S=DB.teams[DB.cur]||EMPTY()}
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
}
async function syncNow(manual){
  if(!CLOUD||!DB.user||DB.user.guest||SYNC.busy)return;
  if(!navigator.onLine){SYNC.state='offline';updateBadge();return}
  SYNC.busy=true;SYNC.state='syncing';SYNC.msg='';updateBadge();
  let changed=false;
  try{
    await getJwt();
    // who am I / my teams
    const prof=await rest('GET','/profiles?user_id=eq.'+encodeURIComponent(DB.user.id)+'&select=is_superuser,display_name');
    if(prof&&prof[0]){DB.user.isSuper=!!prof[0].is_superuser;if(prof[0].display_name)DB.user.name=prof[0].display_name}
    const mem=await rest('GET','/team_members?user_id=eq.'+encodeURIComponent(DB.user.id)+'&deleted=eq.false&select=team_id,role');
    const roleOf={};(mem||[]).forEach(x=>{roleOf[x.team_id]=x.role});
    const ids=new Set(Object.keys(roleOf));
    if(DB.user.isSuper)(DB.view||[]).forEach(id=>ids.add(id));
    if(ids.size){ // teams someone has removed
      const tr=await rest('GET','/teams?select=id,deleted&id=in.('+[...ids].map(encodeURIComponent).join(',')+')');
      (tr||[]).filter(x=>x.deleted).forEach(x=>{ids.delete(x.id);if(DB.teams[x.id]){removeTeamLocal(x.id);changed=true}});
    }
    for(const id of ids){
      if(!DB.teams[id]){DB.teams[id]=Object.assign(EMPTY(),{team:{id,name:'…',age:'',ground:'',primary:'#14243a',secondary:'#f05a8d',onPitch:11,periods:2,periodMins:45}});changed=true}
      const r=roleOf[id]||'viewer';if(DB.teams[id].role!==r){DB.teams[id].role=r;changed=true}
    }
    for(const id of Object.keys(DB.teams)){if(!ids.has(id)){delete DB.teams[id];delete DB.sigs[id];delete DB.cursors[id];changed=true}}
    if(!DB.teams[DB.cur]){const f=Object.keys(DB.teams)[0]||null;DB.cur=f;changed=true}
    S=DB.teams[DB.cur]||EMPTY();
    // push (coach teams), then pull everything
    const mig=(DB.sv||0)<3;
    if(mig)for(const id of ids){DB.cursors[id]={};DB.sigs[id]={}}
    const rev=REV;
    if(!mig)for(const id of ids){const TD=DB.teams[id];if(TD.role==='coach'&&TD.team.name!=='…')await pushTeam(TD)}
    if(REV===rev){
      for(const id of ids){if(await pullTeam(DB.teams[id]))changed=true}
      for(const id of ids){
        const ms=await rest('GET','/team_members?team_id=eq.'+encodeURIComponent(id)+'&deleted=eq.false&select=user_id,role,display_name,email');
        DB.members[id]=ms||[];
      }
      if(mig)DB.sv=3;
    }else SYNC.again=true;
    S=DB.teams[DB.cur]||EMPTY();
    SYNC.state='ok';SYNC.last=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
  }catch(e){
    if(e&&(e.code==='auth'||e.status===401))SYNC.state='auth';
    else if(e instanceof TypeError||!navigator.onLine)SYNC.state='offline';
    else{SYNC.state='error';SYNC.msg=e.message||'Sync failed'}
  }
  SYNC.busy=false;
  updateBadge();
  if(changed||manual)renderSafe();
  if(SYNC.again){SYNC.again=false;schedSync(500)}
}
function updateBadge(){document.querySelectorAll('.sbadge').forEach(el=>{const b=syncBadge();const t=document.createElement('div');t.innerHTML=b;const n=t.firstElementChild;if(n){el.className=n.className;el.textContent=n.textContent;el.dataset.act=n.dataset.act}})}
function renderSafe(){
  if(DRAG&&DRAG.on)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!manualRender)return;
  render();
}
let manualRender=false;
function schedSync(ms){if(!CLOUD||!DB.user||DB.user.guest)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(),ms||3000)}
if(CLOUD){
  window.addEventListener('online',()=>syncNow());
  window.addEventListener('offline',()=>{SYNC.state='offline';updateBadge()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
  setInterval(()=>{if(!document.hidden)syncNow()},25000);
}

  if(LB.key===key)return LB.d;
  const byRef={},evRef={};
  PRO.season.pl.forEach(x=>{(byRef[x.source_ref]=byRef[x.source_ref]||[]).push(x)});
  PRO.season.ev.forEach(x=>{(evRef[x.source_ref]=evRef[x.source_ref]||[]).push(x)});
  const m0={};const get=id=>m0[id]||(m0[id]={id,mins:0,apps:0,starts:0,goals:0,pens:0,assists:0,ga:0,cs:0,yc:0,rc:0,pc:{}});
  const team={p:0,w:0,d:0,l:0,gf:0,ga:0,cs:0,home:{w:0,d:0,l:0},away:{w:0,d:0,l:0},form:[],games:[]};
  const BK=['1-15','16-30','31-45','46-60','61-75','76-90','90+'];
  const bk=m=>m>90?6:Math.min(5,Math.floor((Math.max(1,m)-1)/15));
  const tf=BK.map(()=>0),ta=BK.map(()=>0);
  const games=PRO.matches.filter(m=>m.status==='finished'&&!(V.comp&&compNorm(m.comp)!==V.comp)).sort((a,b)=>String(a.match_date).localeCompare(String(b.match_date)));
  let n=0;
  for(const m of games){
    const side=proClubSide(m),rows=(byRef[m.source_ref]||[]).filter(x=>x.side===side),evs=evRef[m.source_ref]||[];
    if(!rows.length&&!evs.length)continue;
    n++;
    const gf=side==='home'?m.home_goals:m.away_goals,ga=side==='home'?m.away_goals:m.home_goals;
    if(gf!=null&&ga!=null){team.p++;team.gf+=gf;team.ga+=ga;if(!ga)team.cs++;const r=proResult(m,side).res.toLowerCase();team[r]++;team[side][r]++;team.form.push(r.toUpperCase());team.games.push({d:m.match_date,opp:side==='home'?m.away:m.home,home:side==='home',gf,ga,r})}
    const against=evs.filter(e=>e.side!==side).map(e=>e.minute||0);
    evs.forEach(e=>{const b=bk(e.minute||0);if(e.side===side)tf[b]++;else ta[b]++});
    rows.forEach(x=>{
      const id=feedPid(x.name,x.num,ps);if(!id)return;const o=get(id);
      const on=x.starter||x.on_min!=null;if(!on)return;
      const st=x.starter?0:x.on_min;
      const red=(x.red||[])[0];
      const en=x.off_min!=null?x.off_min:red!=null?red:999;
      const mins=Math.max(0,Math.min(en,120)-st);
      o.apps++;if(x.starter)o.starts++;o.mins+=x.off_min!=null||red!=null?Math.max(0,Math.min(en,120)-st):Math.max(0,90-st);
      const conc=against.filter(g=>g>st&&g<=en).length;o.ga+=conc;if(mins>=60&&!conc)o.cs++;
      o.yc+=(x.yellow||[]).length;o.rc+=(x.red||[]).length;
      if(x.pos&&x.pos!=='Substitute')o.pc[x.pos]=(o.pc[x.pos]||0)+1;
    });
    evs.filter(e=>e.side===side&&e.type==='goal').forEach(e=>{
      const a=feedPid(e.player,null,ps);if(a){get(a).goals++;if(/pen/i.test(e.detail||''))get(a).pens++}
      if(e.assist){const b=feedPid(e.assist,null,ps);if(b)get(b).assists++}
    });
  }
  const list=Object.values(m0).map(o=>{const pl=ps.find(p=>p.id===o.id);const pos=Object.keys(o.pc).sort((a,b)=>o.pc[b]-o.pc[a])[0]||(pl&&pl.pos)||'';o.name=pl?pl.name:'';o.num=pl?pl.num:'';o.pos=pos;o.grp=/goalkeeper|keeper|^GK$/i.test(pos)?'GK':/defend|back|^DEF$/i.test(pos)?'DEF':'';return o}).filter(o=>o.name);
  LB.key=key;LB.d={n,list,team,BK,tf,ta};return LB.d;
}

function chartsHtml(d,L){
  const t=d.team;if(!t.p)return '';
  const G='#1e8f4e',R='#c0392b',N='#8a8f98',B='#2563eb';
  /* results ring */
  const tot=t.w+t.d+t.l||1,C=2*Math.PI*40;let off=0;
  const arc=(n,col)=>{const len=C*n/tot;const el=n?`<circle cx="60" cy="60" r="40" fill="none" stroke="${col}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`:'';off+=len;return el};

  /* goals in each match: one stacked bar per match (scored below, conceded above), goal numbers inside, goal difference above */
  const gs=t.games.slice(-16),mx=Math.max(2,...gs.map(g=>g.gf+g.ga)),W=340,H=190,top=26,bot=26,step=(W-12)/gs.length,bw=Math.min(24,step-4),uh=(H-top-bot)/mx;
  const bars=gs.map((g,i)=>{
    const x=6+i*step+(step-bw)/2,cx=x+bw/2,hs=g.gf*uh,hc=g.ga*uh,y0=H-bot,gd=g.gf-g.ga;
    const num=(n,h,y,col)=>n&&h>=11?`<text x="${cx.toFixed(1)}" y="${(y+h/2+3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${n}</text>`:'';
    return `<rect x="${x.toFixed(1)}" y="${(y0-hs).toFixed(1)}" width="${bw.toFixed(1)}" height="${hs.toFixed(1)}" fill="${G}"><title>${esc(g.opp)}: scored ${g.gf}, conceded ${g.ga}</title></rect>`
     +`<rect x="${x.toFixed(1)}" y="${(y0-hs-hc).toFixed(1)}" width="${bw.toFixed(1)}" height="${hc.toFixed(1)}" fill="${R}"/>`
     +num(g.gf,hs,y0-hs)+num(g.ga,hc,y0-hs-hc)
     +`<text x="${cx.toFixed(1)}" y="${(y0-hs-hc-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="${gd>0?G:gd<0?R:N}">${gd>0?'+'+gd:gd<0?'\u2212'+(-gd):'0'}</text>`
     +`<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="8.5" fill="#6b7280">${esc(String(g.opp).replace(/[^A-Za-z ]/g,'').trim().slice(0,3).toUpperCase())}</text>`}).join('');
  const perGame=`<div class="chart"><h3>Goals in each match${gs.length<t.games.length?' (last '+gs.length+')':''}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Goals scored and conceded in each match, with goal difference"><line x1="4" x2="${W-4}" y1="${H-bot}" y2="${H-bot}" stroke="#d9dde3"/>${bars}</svg><div class="cl"><span><i style="background:${G}"></i>Scored</span><span><i style="background:${R}"></i>Conceded</span></div><div class="note" style="margin:4px 0 0">The figure above each bar is the goal difference: + for a win, 0 for a draw, − for a defeat. Oldest match on the left, opponent shown underneath.</div></div>`;
  /* when goals come */
  const m2=Math.max(1,...d.tf,...d.ta),w2=320,h2=120,sp=(w2-16)/d.BK.length,b2=sp/2-4;
  const per=d.BK.map((b,i)=>{const x=8+i*sp,a=(h2-34)*d.tf[i]/m2,c=(h2-34)*d.ta[i]/m2;return `<rect x="${(x+2).toFixed(1)}" y="${(h2-20-a).toFixed(1)}" width="${b2.toFixed(1)}" height="${a.toFixed(1)}" fill="${G}" rx="2"/><rect x="${(x+4+b2).toFixed(1)}" y="${(h2-20-c).toFixed(1)}" width="${b2.toFixed(1)}" height="${c.toFixed(1)}" fill="${R}" rx="2"/><text x="${(x+sp/2).toFixed(1)}" y="${h2-6}" text-anchor="middle" font-size="9" fill="#8a8f98">${b}</text>${d.tf[i]?`<text x="${(x+2+b2/2).toFixed(1)}" y="${(h2-23-a).toFixed(1)}" text-anchor="middle" font-size="9" fill="currentColor">${d.tf[i]}</text>`:''}${d.ta[i]?`<text x="${(x+4+b2*1.5).toFixed(1)}" y="${(h2-23-c).toFixed(1)}" text-anchor="middle" font-size="9" fill="currentColor">${d.ta[i]}</text>`:''}`}).join('');

  /* minutes played */
  const mn=L.filter(o=>o.mins>0).sort((a,b)=>b.mins-a.mins).slice(0,8),mm=Math.max(1,...mn.map(o=>o.mins));

  return `<h2>Season in pictures</h2>${ring}${perGame}${timing}${contrib}${mins}`;
}
function leaderHtml(){

  ${tbl('Goalkeepers','',['Min','GA','Mins/GA','CS'],gks)}

/* ---------- pitch recording (drag & drop / tap) ---------- */
function startFlow(kind,pid){
  const m=M();if(!m)return;
  if(kind==='keypass'||kind==='yellow'||kind==='red'){addEventUndo(m,{t:kind,playerId:pid});return}
  if(kind==='sub')V.sheet={kind:'sub',step:1,d:{off:pid}};
  else V.sheet={kind,step:1,d:{pid}};
  renderSheet();
}
function dropOn(src,where,target,tid,pt){
  const m=M();if(!m||!P(src))return;
  if(m.status==='setup'){lineupDrop(src,target,tid,pt);return}
  const ready=m.clock.state==='ready';
  const ACT=['goal','shot','keypass','save','tackle','mistake','yellow','red'];
  if(where==='pitch'){
    if(target==='bench'){if(ready){m.squad[src].role='sub';delete m.squad[src].pos;save();render()}else startFlow('sub',src);return}
    if(ACT.includes(target)){ready?toast('Kick off first'):startFlow(target,src);return}
    if(target==='tok'&&tid&&tid!==src){
      if(pitchSet(m).has(tid)){movePos(m,src,posMap(m)[tid]);return}
      if(ready){m.squad[src].role='sub';m.squad[tid].role='starter';m.squad[tid].pos=startPos(m)[src];delete m.squad[src].pos;save();render()}
      else{V.sheet={kind:'sub',step:2,d:{off:src,on:tid}};renderSheet()}
      return}
    if(target==='pitch'&&pt){movePos(m,src,nearestPos(pt.x,pt.y));return}
  }else{
    if(target==='tok'&&tid&&tid!==src){
      if(!pitchSet(m).has(tid))return;
      if(ready){const sp=startPos(m);m.squad[tid].role='sub';m.squad[src].role='starter';m.squad[src].pos=sp[tid];delete m.squad[tid].pos;save();render()}
      else{V.sheet={kind:'sub',step:2,d:{off:tid,on:src}};renderSheet()}
    }else if(target==='pitch'||target==='tok'){
      if(ready){
        const to=pt?nearestPos(pt.x,pt.y):null;const sp=startPos(m);
        const occ=to&&Object.keys(sp).find(id=>sp[id]===to);
        if(occ){m.squad[occ].role='sub';delete m.squad[occ].pos}
        m.squad[src].role='starter';if(to)m.squad[src].pos=to;save();render()}
      else{V.sheet={kind:'sub',step:0,d:{on:src}};renderSheet()}
    }
  }
}
let DRAG=null;
function dragEls(x,y){const g=document.querySelector('.ghost');if(g)g.style.display='none';const el=document.elementFromPoint(x,y);if(g)g.style.display='';return el}
document.addEventListener('pointerdown',e=>{
  const tk=e.target.closest&&e.target.closest('.tk[data-drag]');if(!tk||e.button>0)return;
  DRAG={id:tk.dataset.id,where:tk.dataset.where,x:e.clientX,y:e.clientY,on:false,el:tk,hot:null};
});
document.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  if(!DRAG.on){
    if(Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)<8)return;
    DRAG.on=true;const g=DRAG.el.cloneNode(true);g.className='tk ghost';g.removeAttribute('data-drag');g.removeAttribute('data-drop');g.style.pointerEvents='none';document.body.appendChild(g);
    DRAG.ghost=g;DRAG.el.style.opacity='.35';buzz();document.querySelectorAll('.pitch').forEach(x=>x.classList.add('dr'));
  }
  e.preventDefault();
  DRAG.ghost.style.left=e.clientX+'px';DRAG.ghost.style.top=e.clientY+'px';
  const el=dragEls(e.clientX,e.clientY);const dz=el&&el.closest('[data-drop]');
  if(DRAG.hot&&DRAG.hot!==dz)DRAG.hot.classList.remove('drop-on');
  document.querySelectorAll('.zn.hot').forEach(z=>z.classList.remove('hot'));
  const pe=el&&el.closest&&el.closest('.pitch');
  if(pe){const pt=pitchPt(e.clientX,e.clientY);if(pt){const z=pe.querySelector('.zn[data-z="'+nearestPos(pt.x,pt.y)+'"]');if(z)z.classList.add('hot')}}
  const ok=dz&&dz!==DRAG.el&&dz.dataset.drop;
  if(ok){dz.classList.add('drop-on');DRAG.hot=dz}else DRAG.hot=null;
},{passive:false});
function endDrag(e,cancel){
  if(!DRAG)return;const d=DRAG;DRAG=null;
  if(!d.on)return;
  if(d.ghost)d.ghost.remove();d.el.style.opacity='';
  document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on'));
  document.querySelectorAll('.pitch.dr').forEach(x=>x.classList.remove('dr'));document.querySelectorAll('.zn.hot').forEach(z=>z.classList.remove('hot'));
  if(cancel)return;
  const el=dragEls(e.clientX,e.clientY);const dz=el&&el.closest('[data-drop]');
  if(dz&&dz!==d.el&&dz.dataset.drop)dropOn(d.id,d.where,dz.dataset.drop,dz.dataset.id,pitchPt(e.clientX,e.clientY));
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

const logMatch=()=>S.matches.find(x=>x.id===V.logId)||VM();
const EV_TYPES=[['goal','⚽ Goal'],['oppgoal','🥅 Goal against'],['shot','🎯 Shot'],['keypass','🔑 Key pass'],['save','🧤 Key save'],['tackle','🛡️ Key defending'],['mistake','❌ Mistake'],['yellow','🟨 Yellow card'],['red','🟥 Red card'],['sub','🔄 Substitution'],['move','↔️ Position move'],['note','📝 Note']];

const DETAILS={shot:['On target','Off target','Blocked','Hit the post'],save:['Shot','Penalty','One-on-one','Cross / corner'],tackle:['Tackle','Interception','Clearance','Block'],mistake:MISTAKES};
function evEditBody(s){
  const d=s.d,mm=logMatch();
  const ids=new Set(Object.keys(mm.squad));[d.playerId,d.assistId,d.offId,d.onId].forEach(x=>{if(x&&P(x))ids.add(x)});

  let f='';

    case 'oppgoal':f+=`<div class="row"><label>Their number<input type="number" inputmode="numeric" data-sbind="oppNum" value="${esc(d.oppNum||'')}"></label><label style="flex:2">Name<input data-sbind="oppName" value="${esc(d.oppName||'')}"></label></div><label>How<select data-sbind="how">${opts(OPP_HOWS,d.how,'Not recorded')}</select></label>`;break;
    case 'shot':case 'save':case 'tackle':case 'mistake':f+=`<label>Player<select data-sbind="playerId">${popts(d.playerId||'','Choose…')}</select></label><label>Detail<select data-sbind="detail">${opts(DETAILS[d.t],d.detail,'Not recorded')}</select></label>`;break;
    case 'keypass':case 'yellow':case 'red':f+=`<label>Player<select data-sbind="playerId">${popts(d.playerId||'','Choose…')}</select></label>`;break;
    case 'sub':f+=`<label>Coming off<select data-sbind="offId">${popts(d.offId||'','Choose…')}</select></label><label>Coming on<select data-sbind="onId">${popts(d.onId||'','Choose…')}</select></label><label>Reason<select data-sbind="reason">${opts(SUBWHY,d.reason,'Not recorded')}</select></label>`;break;
    case 'move':f+=`<label>Player<select data-sbind="playerId">${popts(d.playerId||'','Choose…')}</select></label><div class="row"><label>From<select data-sbind="how">${opts(Object.keys(POSITIONS),d.how,'Not known')}</select></label><label>To<select data-sbind="detail">${opts(Object.keys(POSITIONS),d.detail,'Choose…')}</select></label></div>`;break;
    case 'tstat':f+=`<div class="note" style="margin-top:0">${esc(d.detail||'')} for ${d.how==='us'?esc(S.team.name):esc(mm.opp||'them')}</div>`;break;
    case 'note':f+=`<label>Note<textarea data-sbind="text">${esc(d.text||'')}</textarea></label>`;break;
    case 'period':f+=`<div class="note">${esc(d.label||'')}</div>`;break;
  }
  const np=Math.max(1,mm.periods||1);
  f+=`<div class="row"><label>Minute<input type="number" inputmode="numeric" data-sbind="minute" value="${esc(d.minute)}"></label><label>${mm.periods===2?'Half':'Period'}<select data-sbind="period">${Array.from({length:np},(_,i)=>`<option value="${i+1}" ${+d.period===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label></div>`;
  return sheetWrap(d.isNew?'Add an event':'Edit event',f+(s.err?`<div class="err">${esc(s.err)}</div>`:'')+`<div class="row"><button class="btn sec" data-act="evBack">Cancel</button><button class="btn lg" data-act="evSave" style="flex:2">Save</button></div>`);
}
function evSave(){
  const s=V.sheet,d=s.d,mm=logMatch();
  const mn=parseInt(d.minute,10);if(!(mn>=0)){s.err='Enter the minute.';renderSheet();return}
  const need=['goal','shot','save','tackle','mistake','keypass','yellow','red','move'].includes(d.t);
  if(d.t==='move'&&!d.detail){s.err='Choose the new position.';renderSheet();return}
  if(need&&!d.playerId){s.err='Choose the player.';renderSheet();return}
  if(d.t==='sub'&&(!d.offId||!d.onId||d.offId===d.onId)){s.err='Choose who came off and who came on.';renderSheet();return}
  const e={id:d.id||uid(),t:d.t,period:+d.period||1,minute:mn,ts:d.ts||Date.now()};
  if(d.t==='goal'){if(d.playerId==='OPPOG'){e.playerId=null;e.how='Opp own goal'}else{e.playerId=d.playerId;e.how=d.how==='Opp own goal'?'':(d.how||'');e.assistId=d.assistId||null}}
  else if(d.t==='oppgoal'){e.oppNum=d.oppNum||'';e.oppName=(d.oppName||'').trim();e.how=d.how||''}
  else if(['shot','save','tackle'].includes(d.t)){e.playerId=d.playerId;e.detail=d.detail||''}
  else if(['keypass','yellow','red'].includes(d.t))e.playerId=d.playerId;
  else if(d.t==='sub'){e.offId=d.offId;e.onId=d.onId;e.reason=d.reason||''}
  else if(d.t==='move'){e.playerId=d.playerId;e.how=d.how||'';e.detail=d.detail}
  else if(d.t==='note')e.text=(d.text||'').trim();
  else if(d.t==='period')e.label=d.label;
  const i=mm.events.findIndex(x=>x.id===e.id);
  if(i>=0)mm.events[i]=e;else mm.events.push(e);
  save();V.sheet={kind:'log'};render();
}
